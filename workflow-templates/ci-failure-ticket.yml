# =============================================================================
# REUSABLE WORKFLOW: Create ticket on workflow failure
# PURPOSE:  When any CI workflow fails, opens a GitHub Issue assigned to the
#           person who made the triggering commit, with full context and a
#           direct link to the failed run so they can fix it immediately.
# TRIGGER:  workflow_run completed with conclusion=failure
# MANAGED:  Do not edit — synced from ZySec-AI/.github/workflow-templates/
# =============================================================================
name: CI Failure — Create Fix Ticket

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  open-ticket:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create fix ticket for committer
        uses: actions/github-script@v7
        with:
          script: |
            const run  = context.payload.workflow_run;
            const repo = context.repo;

            // Skip if this workflow triggered itself (prevent loops)
            if (run.name === 'CI Failure — Create Fix Ticket') return;

            // Get the committer from the head commit
            const committer = run.head_commit?.author?.name  || 'unknown';
            const email      = run.head_commit?.author?.email || '';
            const commitSha  = run.head_sha?.slice(0, 7) || '';
            const commitMsg  = run.head_commit?.message?.split('\n')[0] || '';
            const branch     = run.head_branch || '';
            const runUrl     = run.html_url;
            const runName    = run.name;
            const runId      = run.id;

            // Try to find the GitHub username from the commit author
            let assignees = [];
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: repo.owner, repo: repo.repo, ref: run.head_sha,
              });
              if (commit.author?.login) assignees = [commit.author.login];
            } catch (_) {}

            // Deduplicate: don't open if an open ticket already exists for this run
            const existing = await github.rest.issues.listForRepo({
              owner: repo.owner, repo: repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            const alreadyOpen = existing.data.some(i =>
              i.title.includes(runId.toString()) || i.title.includes(commitSha)
            );
            if (alreadyOpen) {
              core.info('Ticket already exists for this failure — skipping.');
              return;
            }

            const body = [
              `## CI failure: \`${runName}\``,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Workflow | \`${runName}\` |`,
              `| Branch | \`${branch}\` |`,
              `| Commit | \`${commitSha}\` — ${commitMsg} |`,
              `| Author | ${committer} ${email ? `<${email}>` : ''} |`,
              `| Run | [View failed run](${runUrl}) |`,
              '',
              '## Steps to fix',
              '',
              `1. Open the [failed run](${runUrl}) and expand the failing step`,
              '2. Fix the root cause in your branch',
              '3. Push a new commit — CI will re-run automatically',
              '4. Close this issue once the workflow is green',
              '',
              '> This ticket was opened automatically. If the failure is a flaky test or infra issue, label it `status:wontfix` and close.',
            ].join('\n');

            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: `🔴 CI failure: ${runName} on \`${branch}\` (${commitSha}) [run:${runId}]`,
              body,
              labels: ['ci-failure', 'priority:p1', 'type:chore'],
              assignees,
            });
