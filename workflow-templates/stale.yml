# Not synced org-wide (stale disabled). Canonical parked caller:
#   .github/workflows-disabled/stale.yml
# Also kept here as the sync template for re-enable.
# Reusable: .github/workflows/_reusable-stale.yml
name: Stale PR & Issue Notifier

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    uses: ZySec-AI/.github/.github/workflows/_reusable-stale.yml@develop
    secrets: inherit
