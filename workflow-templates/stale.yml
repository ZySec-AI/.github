# Not synced org-wide (stale disabled). Kept as the re-enable template.
# Re-enable: add 'stale' to repo-policy wrapper_workflows.required;
# restore stale.yml in workflow-sync / new-repo-bootstrap /
# sync-org-self-workflows; copy this file to .github/workflows/stale.yml;
# fix permissions (contents: write if branch sweeper stays); run workflow-sync.
# Reusable: .github/workflows/_reusable-stale.yml
name: Stale PR & Issue Notifier

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    uses: ZySec-AI/.github/.github/workflows/_reusable-stale.yml@develop
    secrets: inherit
