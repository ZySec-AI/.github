name: License Compatibility Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-license:
    # Draft PRs do not occupy the CI pool; ready_for_review starts them.
    if: ${{ !github.event.pull_request.draft }}
    uses: ZySec-AI/.github/.github/workflows/_reusable-check-license.yml@develop
    secrets: inherit
