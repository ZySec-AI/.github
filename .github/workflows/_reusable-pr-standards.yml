name: pr standards (reusable)

on:
  workflow_call:
    inputs:
      # Runner labels, as a JSON array string. Defaults to the org's self-hosted
      # CI pool, so every private repository that calls this is unaffected.
      #
      # Callers default to the organization self-hosted CI runner pool.
      runs_on:
        type: string
        required: false
        default: '["self-hosted","linux","x64","zysec-ai-ci"]'
    secrets:
      ORG_ADMIN_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  validate:
    name: Validate PR metadata
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Check PR has description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ] || [ ${#BODY} -lt 20 ]; then
            echo "❌ PR description is empty or too short. Describe what changed and why."
            exit 1
          fi
          echo "✓ PR has description"

      - name: Check PR has at least one label
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          LABELS="$EVENT_LABELS"

          # Fallback to API only when webhook payload has no labels yet
          if [ -z "$LABELS" ]; then
            RESP=$(gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" 2>&1) || true
            if echo "$RESP" | jq -e 'type == "array"' >/dev/null 2>&1; then
              LABELS=$(echo "$RESP" | jq -r '[.[].name] | join(" ")')
            else
              echo "⚠️ Could not fetch labels via API: $RESP"
            fi
          fi

          echo "Labels: ${LABELS:-<none>}"

          if [ -z "$LABELS" ]; then
            echo "❌ PR must have at least one label (any label on the org manifest is accepted)"
            echo "   The taxonomy is https://github.com/ZySec-AI/.github/blob/develop/labels.yml"
            echo "   Common choices: area:ui, area:ci, area:ops, layer:frontend,"
            echo "                   layer:backend, security, regression,"
            echo "                   bugfix (a pull request that fixes a defect)"
            echo ""
            echo "   Note: type, priority and severity are NOT labels any more."
            echo "   Set the Issue Type (Bug/Feature/Task/Epic) and the Priority and"
            echo "   Severity fields on the issue instead."
            exit 1
          fi
          echo "✓ at least one label present"

      - name: Check milestone
        run: |
          MILESTONE="${{ github.event.pull_request.milestone.title }}"
          if [ -z "$MILESTONE" ]; then
            echo "⚠️ No milestone set on this PR. Consider assigning one."
          else
            echo "✓ milestone: $MILESTONE"
          fi

      - name: Hotfix fast-track
        if: contains(github.event.pull_request.labels.*.name, 'hotfix')
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          MILESTONE=$(gh api /repos/$REPO/milestones \
            --jq '.[] | select(.title | startswith("00")) | .number' 2>/dev/null | head -1 || echo "")
          [ -n "$MILESTONE" ] && gh api -X PATCH /repos/$REPO/pulls/$PR -f milestone=$MILESTONE >/dev/null 2>&1 || true

          gh pr comment "$PR" --repo "$REPO" \
            --body $'🚨 **Hotfix detected** — fast-track rules apply:\n- Requires 1 expedited review (target: 1 hour)\n- Bypasses code freeze\n- Will be merged directly to `release` after approval' \
            2>/dev/null || true

          echo "✓ hotfix fast-track applied"
