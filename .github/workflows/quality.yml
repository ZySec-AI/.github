name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, stage, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    # Draft PRs do not occupy the CI pool; ready_for_review starts them.
    if: ${{ !github.event.pull_request.draft }}
    uses: ZySec-AI/.github/.github/workflows/_reusable-quality.yml@develop
    secrets: inherit
    with:
      runs_on: '["self-hosted","linux","x64","zysec-ai-ci"]'
      auto_detect: true
