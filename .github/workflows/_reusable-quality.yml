name: quality gates (reusable)

on:
  workflow_call:
    inputs:
      auto_detect:
        description: 'Run the detect job to auto-detect language stacks. Set false if caller provides python/node/rust inputs.'
        type: boolean
        default: true
      python:
        type: boolean
        default: false
      node:
        type: boolean
        default: false
      rust:
        type: boolean
        default: false
      coverage_threshold:
        description: 'Minimum line coverage % for Python, Node, and Rust quality jobs'
        type: number
        default: 70
      python_version:
        type: string
        default: '3.12'
      node_version:
        type: string
        default: '20'
    secrets:
      ORG_ADMIN_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  detect:
    name: Detect language stacks
    if: inputs.auto_detect
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: detect
        run: |
          python=0
          for f in requirements.txt requirements-dev.txt requirements-prod.txt requirements-test.txt pyproject.toml setup.py; do
            if [ -f "$f" ]; then python=1; break; fi
          done
          echo "python=$python" >> "$GITHUB_OUTPUT"
          # The node-quality job runs from the repository root. Nested frontend
          # packages should use their own workflow instead of being auto-detected
          # here and then failing root-level setup/install steps.
          if [ -f package.json ] || [ -f next.config.ts ] || [ -f next.config.js ] || [ -f next.config.mjs ]; then
            echo "node=1" >> "$GITHUB_OUTPUT"
          else
            echo "node=0" >> "$GITHUB_OUTPUT"
          fi
          echo "rust=$([ -f Cargo.toml ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

  python-quality:
    name: Python — lint / type / coverage
    needs: detect
    if: |
      always() && (
        (inputs.auto_detect && needs.detect.result == 'success' && needs.detect.outputs.python == '1') ||
        (!inputs.auto_detect && inputs.python)
      )
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Configure git for private deps
        env:
          HAS_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN != '' }}
        if: env.HAS_TOKEN == 'true'
        run: |
          # Self-hosted runners retain global gitconfig across jobs. A plain
          # `git config` fails with "cannot overwrite multiple values" once a
          # prior job already set this insteadOf — use --replace-all.
          git config --global --replace-all \
            url."https://${{ secrets.ORG_ADMIN_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format
        run: uv run ruff format --check .

      - name: MyPy type check
        run: uv run mypy . --ignore-missing-imports
        continue-on-error: true

      - name: pytest + coverage
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ inputs.coverage_threshold }} \
            -m "not e2e" \
            -q
        continue-on-error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  node-quality:
    name: Node / Next.js — lint / type / build / coverage
    needs: detect
    if: |
      always() && (
        (inputs.auto_detect && needs.detect.result == 'success' && needs.detect.outputs.node == '1') ||
        (!inputs.auto_detect && inputs.node)
      )
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 30
    env:
      # Placeholders for Next.js + Prisma builds (generate/build only — no live DB)
      MONGODB_URI: mongodb://127.0.0.1:27017/ci-gate
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      API_URL: http://localhost:8001
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Detect stack (Next.js, Prisma, package manager)
        id: stack
        run: |
          nextjs=0
          prisma=0
          if [ -f package.json ] && grep -qE '"next"[[:space:]]*:' package.json; then nextjs=1; fi
          if [ -f next.config.ts ] || [ -f next.config.js ] || [ -f next.config.mjs ]; then nextjs=1; fi
          if [ -f prisma/schema.prisma ]; then prisma=1; fi

          if [ -f pnpm-lock.yaml ]; then pm=pnpm
          elif [ -f yarn.lock ]; then pm=yarn
          elif [ -f package-lock.json ]; then pm=npm
          else pm=npm
          fi

          lockfile=0
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ] || [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            lockfile=1
          fi

          echo "nextjs=$nextjs" >> "$GITHUB_OUTPUT"
          echo "prisma=$prisma" >> "$GITHUB_OUTPUT"
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "lockfile=$lockfile" >> "$GITHUB_OUTPUT"
          echo "Detected: nextjs=$nextjs prisma=$prisma pm=$pm lockfile=$lockfile"

      - name: Detect pnpm version
        id: pnpm-ver
        if: steps.stack.outputs.pm == 'pnpm'
        run: |
          VER=$(node -pe "require('./package.json').packageManager || ''" 2>/dev/null | sed 's/pnpm@//' | tr -d '\n')
          echo "version=${VER:-9}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        if: steps.stack.outputs.pm == 'pnpm'
        with:
          version: ${{ steps.pnpm-ver.outputs.version }}

      - name: Setup Node with package-manager cache
        if: steps.stack.outputs.lockfile == '1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.stack.outputs.pm }}

      - name: Setup Node without package-manager cache
        if: steps.stack.outputs.lockfile != '1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Configure Git Authentication
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          git config --global --add url."https://${GH_TOKEN}@github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://${GH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: |
          case "${{ steps.stack.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm)
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
              ;;
          esac

      - name: Prisma generate
        if: steps.stack.outputs.prisma == '1'
        run: |
          case "${{ steps.stack.outputs.pm }}" in
            pnpm) pnpm exec prisma generate ;;
            yarn) yarn prisma generate ;;
            npm) npx prisma generate ;;
          esac

      - name: Lint
        run: |
          PM="${{ steps.stack.outputs.pm }}"
          node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint?0:1)" || { echo "No lint script — skipping"; exit 0; }
          case "$PM" in
            pnpm) pnpm run lint ;;
            yarn) yarn lint ;;
            npm) npm run lint ;;
          esac

      - name: Type check
        run: |
          PM="${{ steps.stack.outputs.pm }}"
          has() { node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1']?0:1)"; }
          run() {
            case "$PM" in
              pnpm) pnpm run "$1" ;;
              yarn) yarn "$1" ;;
              npm) npm run "$1" ;;
            esac
          }
          tsc() {
            case "$PM" in
              pnpm) pnpm exec tsc --noEmit ;;
              yarn) yarn exec tsc --noEmit ;;
              npm) npx tsc --noEmit ;;
            esac
          }
          if has type-check; then run type-check
          elif has typecheck; then run typecheck
          else tsc
          fi

      - name: Build
        env:
          NODE_ENV: production
        run: |
          PM="${{ steps.stack.outputs.pm }}"
          node -e "const s=require('./package.json').scripts||{}; process.exit(s.build?0:1)" || { echo "No build script — skipping"; exit 0; }
          case "$PM" in
            pnpm) pnpm run build ;;
            yarn) yarn build ;;
            npm) npm run build ;;
          esac

      - name: Test + coverage (>= ${{ inputs.coverage_threshold }}%)
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -euo pipefail
          PM="${{ steps.stack.outputs.pm }}"
          has() { node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1']?0:1)"; }
          run_script() {
            case "$PM" in
              pnpm) pnpm run "$1" ;;
              yarn) yarn "$1" ;;
              npm) npm run "$1" ;;
            esac
          }
          exec_bin() {
            case "$PM" in
              pnpm) pnpm exec "$@" ;;
              yarn) yarn exec "$@" ;;
              npm) npx "$@" ;;
            esac
          }
          enforce_summary() {
            # Fail closed when a coverage summary exists and is under threshold.
            for f in coverage/coverage-summary.json coverage-critical/coverage-summary.json coverage-summary.json; do
              if [ -f "$f" ]; then
                node -e "
                  const fs=require('fs');
                  const t=Number(process.env.COVERAGE_THRESHOLD);
                  const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
                  const lines=(j.total&&j.total.lines&&j.total.lines.pct!=null)?Number(j.total.lines.pct):null;
                  if (lines==null) { console.error('No total.lines.pct in', process.argv[1]); process.exit(1); }
                  console.log('Node line coverage:', lines + '%', '(threshold ' + t + '%)');
                  if (lines < t) { console.error('Coverage below threshold'); process.exit(1); }
                " "$f"
                return 0
              fi
            done
            return 1
          }

          # Prefer runners that can enforce the org threshold directly.
          if node -e "const p=require('./package.json'); const d={...p.devDependencies||{},...p.dependencies||{}}; process.exit(d.vitest||d['@vitest/coverage-v8']?0:1)"; then
            exec_bin vitest run --coverage \
              --coverage.thresholds.lines="${COVERAGE_THRESHOLD}" \
              --coverage.thresholds.functions="${COVERAGE_THRESHOLD}" \
              --coverage.thresholds.branches="${COVERAGE_THRESHOLD}" \
              --coverage.thresholds.statements="${COVERAGE_THRESHOLD}"
          elif node -e "const p=require('./package.json'); const d={...p.devDependencies||{},...p.dependencies||{}}; process.exit(d.jest||d['@jest/globals']?0:1)"; then
            exec_bin jest --coverage --coverageThreshold="{\"global\":{\"lines\":${COVERAGE_THRESHOLD},\"functions\":${COVERAGE_THRESHOLD},\"branches\":${COVERAGE_THRESHOLD},\"statements\":${COVERAGE_THRESHOLD}}}"
          elif has coverage; then
            run_script coverage
            enforce_summary || { echo "::error::coverage script ran but no coverage-summary.json found to enforce ${COVERAGE_THRESHOLD}%"; exit 1; }
          elif has test:coverage; then
            run_script test:coverage
            enforce_summary || { echo "::error::test:coverage ran but no coverage-summary.json found to enforce ${COVERAGE_THRESHOLD}%"; exit 1; }
          elif has coverage:critical; then
            run_script coverage:critical
            enforce_summary || { echo "::error::coverage:critical ran but no coverage-summary.json found to enforce ${COVERAGE_THRESHOLD}%"; exit 1; }
          else
            echo "::error::No Node coverage runner found. Add vitest/jest coverage (preferred) or a coverage script that writes coverage-summary.json."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: node-coverage-report
          path: |
            coverage/
            coverage-critical/
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  rust-quality:
    name: Rust — fmt / clippy / test / coverage
    needs: detect
    if: |
      always() && (
        (inputs.auto_detect && needs.detect.result == 'success' && needs.detect.outputs.rust == '1') ||
        (!inputs.auto_detect && inputs.rust)
      )
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install Python dev libraries (required for PyO3 crates)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-dev
          echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test + coverage (>= ${{ inputs.coverage_threshold }}%)
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -euo pipefail
          # Print a human summary (like pytest/vitest), then fail closed under threshold.
          # --lcov alone writes a file and can exit 1 with almost no % shown in the log.
          set +e
          cargo llvm-cov --all-features --workspace \
            --summary-only \
            --fail-under-lines "${COVERAGE_THRESHOLD}"
          status=$?
          set -e

          # Keep an lcov artifact even when the threshold fails (best-effort).
          cargo llvm-cov report --lcov --output-path lcov.info 2>/dev/null \
            || cargo llvm-cov --no-run --lcov --output-path lcov.info 2>/dev/null \
            || true

          if [ "$status" -ne 0 ]; then
            echo "::error title=Rust coverage below threshold::Line coverage is below ${COVERAGE_THRESHOLD}% (tests may still have passed)."
            echo "Open the summary above for the actual %. Raise coverage or temporarily set coverage_threshold in the repo quality.yml."
            exit 1
          fi
          echo "✓ Rust line coverage meets ${COVERAGE_THRESHOLD}% threshold"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: rust-coverage-report
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    needs: [detect, python-quality, node-quality, rust-quality]
    if: always()
    steps:
      - name: Evaluate gates
        run: |
          if [ "${{ inputs.auto_detect }}" = "true" ]; then
            PY="${{ needs.detect.outputs.python }}"
            ND="${{ needs.detect.outputs.node }}"
            RS="${{ needs.detect.outputs.rust }}"
          else
            PY=$([ "${{ inputs.python }}" = "true" ] && echo 1 || echo 0)
            ND=$([ "${{ inputs.node }}" = "true" ] && echo 1 || echo 0)
            RS=$([ "${{ inputs.rust }}" = "true" ] && echo 1 || echo 0)
          fi
          if [ "$PY" != "1" ] && [ "$ND" != "1" ] && [ "$RS" != "1" ]; then
            echo "No language stack detected — nothing to gate."
            exit 0
          fi
          FAILED=false
          for result in \
            "${{ needs.python-quality.result }}" \
            "${{ needs.node-quality.result }}" \
            "${{ needs.rust-quality.result }}"; do
            [ "$result" == "failure" ] && FAILED=true
          done
          if $FAILED; then
            echo "One or more quality gates failed."
            exit 1
          fi
          echo "All quality gates passed."
