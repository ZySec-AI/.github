# =============================================================================
# WORKFLOW: Sync canonical labels org-wide
# PURPOSE:  Bring every non-archived repo to the taxonomy in /labels.yml
# TRIGGERS: schedule (daily 03:17 UTC), push to develop (labels.yml changed),
#           workflow_dispatch
# SECRETS:  ORG_ADMIN_TOKEN
#
# REPLACES: the previous version, which synced from .github/labels/labels.json —
#           a second, different label list to the one in /labels.yml. Neither was
#           enforced and the two disagreed. labels.json has been deleted.
#
# SAFETY:   This can delete labels across every repository, and deleting a label
#           strips it from every issue it was ever on, irreversibly. So it
#           REPORTS by default and deletes only when a human runs it with
#           apply: true. The schedule never deletes.
# CONTACT:  platform-eng@zysec.ai
# =============================================================================
name: sync canonical labels org-wide

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write changes (false = report only)"
        type: boolean
        default: false
      repo:
        description: "Limit to one repository (blank = all)"
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [develop]
    paths:
      - 'labels.yml'
      - '.github/scripts/reconcile_labels.py'
      - '.github/workflows/sync-labels.yml'

permissions: {}

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          # Only a deliberate manual run may delete. Schedule and push report.
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}
          ONLY: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          args=(labels.yml)
          [ "${APPLY}" = "true" ] && args+=(--apply)
          [ -n "${ONLY:-}" ] && args+=(--repo "$ONLY")
          # Exit 1 means drift was found, which is a report, not a failure.
          python3 .github/scripts/reconcile_labels.py "${args[@]}" | tee report.md || true

      - name: Summarise
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
