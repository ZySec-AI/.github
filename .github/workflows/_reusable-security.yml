# =============================================================================
# WORKFLOW: Reusable - Security Scanning
# PURPOSE:  Runs gitleaks secret scan, dependency-review,
#           trivy filesystem + container scans, and auto-opens GitHub issues
#           for HIGH/CRITICAL findings on non-PR runs (push/schedule).
# TRIGGERS: workflow_call
# INPUTS:   python, node, rust, fast-mode - all retained for caller
#           compatibility only; see the note on CodeQL removal below.
# SECRETS:  ORG_ADMIN_TOKEN, TRIVY_TEAM_WEBHOOK (optional)
# WHY no CodeQL: the sast-codeql job was removed on 2026-09-09. It had been
#                skipped on every run across all 43 repositories, because its
#                language detection returned an empty list, so it produced no
#                findings while implying SAST coverage existed. GitHub Advanced
#                Security is off org-wide (0 billable committers), so it was
#                also costing nothing. Restoring it means fixing detection
#                first, not just re-adding the job.
# WHY fast-mode is now inert: it only ever gated CodeQL. Callers still pass it
#                and it is still declared, so nothing breaks, but the fast and
#                full paths now run the same jobs.
# CONTACT:  platform-eng@zysec.ai
# =============================================================================
name: security scan (reusable)

on:
  workflow_call:
    inputs:
      # Runner labels, as a JSON array string. Defaults to the org's self-hosted
      # CI pool, so every private repository that calls this is unaffected.
      #
      # Callers default to the organization self-hosted CI runner pool.
      runs_on:
        type: string
        required: false
        default: '["self-hosted","linux","x64","zysec-ai-ci"]'
      auto_detect:
        description: 'Detect Python/Node/Rust/Docker from repo files (recommended)'
        type: boolean
        default: true
      python:
        description: 'No-op since CodeQL removal. Declared so existing callers do not break.'
        type: boolean
        default: false
      node:
        description: 'No-op since CodeQL removal. Declared so existing callers do not break.'
        type: boolean
        default: false
      rust:
        description: 'Enable Rust-specific scans'
        type: boolean
        default: false
      docker:
        type: boolean
        default: false
      image_ref:
        type: string
        default: ''
      fast-mode:
        description: 'No-op since CodeQL removal. Declared so existing callers do not break.'
        type: boolean
        default: false
    secrets:
      ORG_ADMIN_TOKEN:
        required: true
      TRIVY_TEAM_WEBHOOK:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  detect:
    name: Detect language stacks
    if: inputs.auto_detect
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      rust: ${{ steps.detect.outputs.rust }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: detect
        run: |
          py=$(find . -name 'requirements*.txt' -o -name 'pyproject.toml' -o -name 'setup.py' | head -1 | wc -l | tr -d ' ')
          nd=$(find . -name 'package.json' | head -1 | wc -l | tr -d ' ')
          rs=$(find . -name 'Cargo.toml' | head -1 | wc -l | tr -d ' ')
          dk=$(find . -name 'Dockerfile' | head -1 | wc -l | tr -d ' ')
          echo "python=$py" >> "$GITHUB_OUTPUT"
          echo "node=$nd" >> "$GITHUB_OUTPUT"
          echo "rust=$rs" >> "$GITHUB_OUTPUT"
          echo "docker=$dk" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks-action requires GITLEAKS_LICENSE for org-owned repos (even v2.3.3).
      # The MIT-licensed gitleaks CLI is free — install and run it directly.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLf \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          gitleaks detect --source . --log-opts="$BASE..$HEAD" --redact --verbose --exit-code 1
      - name: Scan (push / dispatch)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --verbose --exit-code 1

  dep-review:
    name: Dependency Review
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, MPL-2.0
          comment-summary-in-pr: true
        continue-on-error: true

  trivy-fs:
    name: Trivy - filesystem scan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 7

  trivy-image:
    name: Trivy - container image scan
    needs: detect
    if: |
      always() && inputs.image_ref != '' && (
        (inputs.auto_detect && needs.detect.result == 'success' && needs.detect.outputs.docker == '1') ||
        (!inputs.auto_detect && inputs.docker)
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ inputs.image_ref }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 7
