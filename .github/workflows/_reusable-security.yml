# =============================================================================
# WORKFLOW: Reusable - Security Scanning
# PURPOSE:  Runs gitleaks secret scan, CodeQL SAST, dependency-review,
#           trivy filesystem + container scans, and auto-opens GitHub issues
#           for HIGH/CRITICAL findings on non-PR runs (push/schedule).
# TRIGGERS: workflow_call
# INPUTS:   python (bool, default true), node (bool, default true),
#           rust (bool, default false), fast-mode (bool, default false)
# SECRETS:  ORG_ADMIN_TOKEN, TRIVY_TEAM_WEBHOOK (optional)
# WHY fast-mode: hotfix path needs <5min; skips CodeQL (slow) but keeps
#                gitleaks + trivy (fast, highest-value for hotfixes)
# CONTACT:  platform-eng@zysec.ai
# =============================================================================
name: security scan (reusable)

on:
  workflow_call:
    inputs:
      # Runner labels, as a JSON array string. Defaults to the org's self-hosted
      # CI pool, so every private repository that calls this is unaffected.
      #
      # ZySec-AI/.github is a *public* repository and runner group 4 sets
      # allows_public_repositories=false, so a self-hosted job there queues for
      # ever — and would be a fork-PR attack path on shared, persistent runners
      # if that setting were ever relaxed. It passes '["ubuntu-latest"]'.
      runs_on:
        type: string
        required: false
        default: '["self-hosted","linux","x64","zysec-ai-ci"]'
      auto_detect:
        description: 'Detect Python/Node/Rust/Docker from repo files (recommended)'
        type: boolean
        default: true
      python:
        description: 'Enable Python-specific scans (CodeQL python)'
        type: boolean
        default: false
      node:
        description: 'Enable Node-specific scans (CodeQL javascript)'
        type: boolean
        default: false
      rust:
        description: 'Enable Rust-specific scans'
        type: boolean
        default: false
      docker:
        type: boolean
        default: false
      image_ref:
        type: string
        default: ''
      fast-mode:
        description: 'Skip slow scans (CodeQL) - used by hotfix fast-path'
        type: boolean
        default: false
    secrets:
      ORG_ADMIN_TOKEN:
        required: true
      TRIVY_TEAM_WEBHOOK:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  detect:
    name: Detect language stacks
    if: inputs.auto_detect
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      rust: ${{ steps.detect.outputs.rust }}
      docker: ${{ steps.detect.outputs.docker }}
      codeql_languages: ${{ steps.detect.outputs.codeql_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: detect
        run: |
          py=$(find . -name 'requirements*.txt' -o -name 'pyproject.toml' -o -name 'setup.py' | head -1 | wc -l | tr -d ' ')
          nd=$(find . -name 'package.json' | head -1 | wc -l | tr -d ' ')
          rs=$(find . -name 'Cargo.toml' | head -1 | wc -l | tr -d ' ')
          dk=$(find . -name 'Dockerfile' | head -1 | wc -l | tr -d ' ')
          echo "python=$py" >> "$GITHUB_OUTPUT"
          echo "node=$nd" >> "$GITHUB_OUTPUT"
          echo "rust=$rs" >> "$GITHUB_OUTPUT"
          echo "docker=$dk" >> "$GITHUB_OUTPUT"
          langs='[]'
          [ "$py" = "1" ] && langs='["python"]'
          if [ "$py" = "1" ] && [ "$nd" = "1" ]; then
            langs='["python","javascript"]'
          elif [ "$nd" = "1" ]; then
            langs='["javascript"]'
          fi
          echo "codeql_languages=$langs" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks-action requires GITLEAKS_LICENSE for org-owned repos (even v2.3.3).
      # The MIT-licensed gitleaks CLI is free — install and run it directly.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLf \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          gitleaks detect --source . --log-opts="$BASE..$HEAD" --redact --verbose --exit-code 1
      - name: Scan (push / dispatch)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --verbose --exit-code 1

  sast-codeql:
    name: SAST - CodeQL
    needs: detect
    if: |
      always() && !inputs.fast-mode && (
        (inputs.auto_detect && needs.detect.result == 'success' && needs.detect.outputs.codeql_languages != '[]') ||
        (!inputs.auto_detect && (inputs.python || inputs.node))
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(
          inputs.auto_detect && needs.detect.outputs.codeql_languages ||
          (inputs.python && inputs.node) && '["python","javascript"]' ||
          inputs.python && '["python"]' ||
          inputs.node && '["javascript"]' ||
          '[]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: github/codeql-action/init@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
      - uses: github/codeql-action/analyze@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        id: codeql-analyze
        with:
          category: "/language:${{ matrix.language }}"
          output: /tmp/codeql-sarif
          upload: never
      # ponytail: upload separated so GHAS-not-enabled is a warning, not a job failure
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        continue-on-error: true
        with:
          sarif_file: /tmp/codeql-sarif
          category: "/language:${{ matrix.language }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}
          path: /tmp/codeql-sarif
          if-no-files-found: ignore
          retention-days: 14

  dep-review:
    name: Dependency Review
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, MPL-2.0
          comment-summary-in-pr: true
        continue-on-error: true

  trivy-fs:
    name: Trivy - filesystem scan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 7

  trivy-image:
    name: Trivy - container image scan
    needs: detect
    if: |
      always() && inputs.image_ref != '' && (
        (inputs.auto_detect && needs.detect.result == 'success' && needs.detect.outputs.docker == '1') ||
        (!inputs.auto_detect && inputs.docker)
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ inputs.image_ref }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 7
