# =============================================================================
# WORKFLOW: Reusable - Security Scanning
# PURPOSE:  Runs gitleaks secret scan, CodeQL SAST, dependency-review,
#           trivy filesystem + container scans, and auto-opens GitHub issues
#           for HIGH/CRITICAL findings on non-PR runs (push/schedule).
# TRIGGERS: workflow_call
# INPUTS:   python (bool, default true), node (bool, default true),
#           rust (bool, default false), fast-mode (bool, default false)
# SECRETS:  ORG_ADMIN_TOKEN, TRIVY_TEAM_WEBHOOK (optional)
# WHY fast-mode: hotfix path needs <5min; skips CodeQL (slow) but keeps
#                gitleaks + trivy (fast, highest-value for hotfixes)
# CONTACT:  platform-eng@zysec.ai
# =============================================================================
name: security scan (reusable)

on:
  workflow_call:
    inputs:
      python:
        description: 'Enable Python-specific scans (CodeQL python)'
        type: boolean
        default: true
      node:
        description: 'Enable Node-specific scans (CodeQL javascript)'
        type: boolean
        default: true
      rust:
        description: 'Enable Rust-specific scans'
        type: boolean
        default: false
      docker:
        type: boolean
        default: false
      image_ref:
        type: string
        default: ''
      fast-mode:
        description: 'Skip slow scans (CodeQL) - used by hotfix fast-path'
        type: boolean
        default: false
    secrets:
      ORG_ADMIN_TOKEN:
        required: true
      TRIVY_TEAM_WEBHOOK:
        required: false
      GITLEAKS_LICENSE:
        required: false

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # v2.3.3 is the last free version; v2.3.4+ requires a paid license
        # for private repos. If you have a license, upgrade and set
        # GITLEAKS_LICENSE as an org secret.
        uses: gitleaks/gitleaks-action@cb7149a9b57195b609c63e8518d2c6056677d2d0  # v2.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}

  sast-codeql:
    name: SAST - CodeQL
    if: (inputs.python || inputs.node) && !inputs.fast-mode
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(
          (inputs.python && inputs.node) && '["python","javascript"]' ||
          inputs.python && '["python"]' ||
          inputs.node && '["javascript"]' ||
          '[]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: github/codeql-action/init@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
      - uses: github/codeql-action/analyze@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          category: "/language:${{ matrix.language }}"

  dep-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9  # v4.7.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, MPL-2.0
          comment-summary-in-pr: true
        continue-on-error: true

  trivy-fs:
    name: Trivy - filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy - container image scan
    if: inputs.docker && inputs.image_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ inputs.image_ref }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
