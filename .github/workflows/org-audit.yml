name: Org 360° Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read
  security-events: read

jobs:
  audit:
    # GitHub-hosted on purpose. This workflow runs *in* ZySec-AI/.github, which
    # is a public repository, and runner group 4 (the zysec-ai-ci runners) sets
    # allows_public_repositories=false — so a self-hosted job here queues for
    # ever. The oldest such run sat unstarted for 31 hours. These are API
    # scripts, not builds, and GitHub-hosted minutes are free for public repos.
    # The _reusable-*.yml workflows keep self-hosted: they run in the caller's
    # context, which is a private repo with access to group 4.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run org audit
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ZySec-AI
        run: python3 scripts/org_audit.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: org-audit-report
          path: org-audit-report.html
          retention-days: 90

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp org-audit-report.html .github/org-audit-report.html
          git add .github/org-audit-report.html
          git diff --cached --quiet || git commit -m "chore: update org audit report [skip ci]"
          git push origin HEAD:develop
