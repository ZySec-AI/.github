name: code review (reusable)

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: 'audit'
      fail_on:
        type: string
        default: 'CRITICAL'
    secrets:
      LLM_PROVIDER:
        required: false   # optional label for logs (openrouter, minimax, self-hosted, etc.)
      LLM_API_KEY:
        required: true
      LLM_BASE_URL:
        required: true    # Anthropic-compatible API base URL — set per org in GitHub secrets
      LLM_MODEL:
        required: true    # model ID at that endpoint — set per org in GitHub secrets
      ORG_ADMIN_TOKEN:
        required: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate LLM config
        id: provider
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -z "${{ secrets.LLM_API_KEY }}" ]; then
            echo "❌ LLM_API_KEY org secret is required" >&2
            exit 1
          fi

          BASE_URL=$(echo "${LLM_BASE_URL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          MODEL=$(echo "${LLM_MODEL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          PROVIDER=$(echo "${LLM_PROVIDER:-custom}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$BASE_URL" ]; then
            echo "❌ LLM_BASE_URL org secret is required" >&2
            exit 1
          fi
          if [ -z "$MODEL" ]; then
            echo "❌ LLM_MODEL org secret is required" >&2
            exit 1
          fi

          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "model=$MODEL"       >> $GITHUB_OUTPUT
          echo "✓ LLM provider label: $PROVIDER | model: $MODEL @ $BASE_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code + codebase-ai + gh
        run: |
          sudo npm install -g @anthropic-ai/claude-code@2.1.119 codebase-ai@0.7.0
          claude --version

      - name: Determine context
        id: ctx
        run: |
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            audit)
              BASE="${{ github.event.before }}"
              if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
                BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.sha }}")
              fi
              echo "base=$BASE" >> $GITHUB_OUTPUT
              echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
              ;;
            pr-review)
              echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
              echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
              echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
              ;;
            issue-triage|issue-fix)
              echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
              echo "base=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              echo "head=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Checkout code-reviewer scripts
        uses: actions/checkout@v4
        with:
          repository: ZySec-AI/code-reviewer
          ref: develop
          path: .code-reviewer
          token: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}

      - name: Prepare code-reviewer for proxy endpoints
        run: |
          # Claude Code --model validates against Anthropic model IDs before
          # calling ANTHROPIC_BASE_URL. For proxy endpoints, use env vars only.
          sed -i 's/\[ -n "${ANTHROPIC_DEFAULT_SONNET_MODEL:-}" \] && model_arg=(--model "$ANTHROPIC_DEFAULT_SONNET_MODEL")/model_arg=() # env-only for proxy/' \
            .code-reviewer/scripts/entrypoint.sh

      - name: Preflight LLM endpoint
        continue-on-error: ${{ inputs.fail_on == 'NEVER' }}
        env:
          ANTHROPIC_BASE_URL: ${{ steps.provider.outputs.base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ steps.provider.outputs.model }}
        run: |
          set -euo pipefail
          BASE="${ANTHROPIC_BASE_URL%/}"
          PAYLOAD="{\"model\":\"$LLM_MODEL\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}"
          echo "Preflight: POST $BASE/v1/messages model=$LLM_MODEL"
          try_auth() {
            local header_name="$1"
            local header_value="$2"
            curl -sS -o /tmp/llm-preflight.json -w '%{http_code}' \
              -X POST "$BASE/v1/messages" \
              -H "content-type: application/json" \
              -H "$header_name: $header_value" \
              -H "anthropic-version: 2023-06-01" \
              -d "$PAYLOAD"
          }
          HTTP=$(try_auth "x-api-key" "$ANTHROPIC_AUTH_TOKEN") || HTTP=000
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "✓ LLM endpoint accepted model (HTTP $HTTP)"
            exit 0
          fi
          HTTP=$(try_auth "Authorization" "Bearer $ANTHROPIC_AUTH_TOKEN") || HTTP=000
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "✓ LLM endpoint accepted model (HTTP $HTTP)"
            exit 0
          fi
          echo "❌ LLM preflight failed (HTTP ${HTTP:-none})" >&2
          head -c 500 /tmp/llm-preflight.json >&2 || true
          echo "" >&2
          echo "Check org secrets: LLM_BASE_URL + LLM_MODEL + LLM_API_KEY must match the same provider." >&2
          exit 1

      - name: Run code reviewer
        continue-on-error: ${{ inputs.fail_on == 'NEVER' }}
        env:
          ANTHROPIC_BASE_URL: ${{ steps.provider.outputs.base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.provider.outputs.model }}
          API_TIMEOUT_MS: '600000'
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ steps.ctx.outputs.base }}
          HEAD_SHA: ${{ steps.ctx.outputs.head }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          REVIEW_FAIL_ON: ${{ inputs.fail_on }}
        run: bash .code-reviewer/scripts/entrypoint.sh
