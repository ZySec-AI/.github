name: code review (reusable)

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: 'audit'
      fail_on:
        type: string
        default: 'CRITICAL'
    secrets:
      LLM_PROVIDER:
        required: false   # optional label for logs (openrouter, minimax, self-hosted, etc.)
      LLM_API_KEY:
        required: true
      LLM_BASE_URL:
        required: true    # Anthropic-compatible API base URL — set per org in GitHub secrets
      LLM_MODEL:
        required: true    # model ID at that endpoint — set per org in GitHub secrets
      ORG_ADMIN_TOKEN:
        required: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate LLM config
        id: provider
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -z "${{ secrets.LLM_API_KEY }}" ]; then
            echo "❌ LLM_API_KEY org secret is required" >&2
            exit 1
          fi

          BASE_URL=$(echo "${LLM_BASE_URL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          MODEL=$(echo "${LLM_MODEL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          PROVIDER=$(echo "${LLM_PROVIDER:-custom}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$BASE_URL" ]; then
            echo "❌ LLM_BASE_URL org secret is required (e.g. https://api.z.ai/api/anthropic)" >&2
            exit 1
          fi
          if [ -z "$MODEL" ]; then
            echo "❌ LLM_MODEL org secret is required (e.g. glm-5.1, MiniMax-M2.7, anthropic/claude-sonnet-4)" >&2
            exit 1
          fi

          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "model=$MODEL"       >> $GITHUB_OUTPUT
          echo "✓ LLM provider label: $PROVIDER | model: $MODEL @ $BASE_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code + codebase-ai + gh
        run: |
          sudo npm install -g @anthropic-ai/claude-code@2.1.119 codebase-ai@0.7.0
          claude --version

      - name: Determine context
        id: ctx
        run: |
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            audit)
              BASE="${{ github.event.before }}"
              if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
                BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.sha }}")
              fi
              echo "base=$BASE" >> $GITHUB_OUTPUT
              echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
              ;;
            pr-review)
              echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
              echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
              echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
              ;;
            issue-triage|issue-fix)
              echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
              echo "base=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              echo "head=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Checkout code-reviewer scripts
        uses: actions/checkout@v4
        with:
          repository: ZySec-AI/code-reviewer
          ref: develop
          path: .code-reviewer
          token: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}

      - name: Run code reviewer
        continue-on-error: ${{ inputs.fail_on == 'NEVER' }}
        env:
          ANTHROPIC_BASE_URL: ${{ steps.provider.outputs.base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.provider.outputs.model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.provider.outputs.model }}
          API_TIMEOUT_MS: '600000'
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ steps.ctx.outputs.base }}
          HEAD_SHA: ${{ steps.ctx.outputs.head }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          REVIEW_FAIL_ON: ${{ inputs.fail_on }}
        run: bash .code-reviewer/scripts/entrypoint.sh
