name: code review (reusable)

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: 'audit'
      fail_on:
        type: string
        default: 'CRITICAL'
    secrets:
      LLM_PROVIDER:
        required: false   # MINIMAX | ZAI | ANTHROPIC
      LLM_API_KEY:
        required: true
      LLM_BASE_URL:
        required: false   # org secret — overrides provider default URL
      LLM_MODEL:
        required: false
      ORG_ADMIN_TOKEN:
        required: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve provider config
        id: provider
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -z "${{ secrets.LLM_API_KEY }}" ]; then
            echo "❌ LLM_API_KEY org secret is required" >&2
            exit 1
          fi

          PROVIDER=$(echo "${LLM_PROVIDER:-ZAI}" | tr '[:lower:]' '[:upper:]' | tr -d ' \t\r\n')
          BASE_URL=$(echo "${LLM_BASE_URL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$BASE_URL" ]; then
            case "$PROVIDER" in
              MINIMAX) BASE_URL="https://api.minimax.io/anthropic" ;;
              ZAI)     BASE_URL="https://api.z.ai/api/anthropic" ;;
              ANTHROPIC) BASE_URL="https://api.anthropic.com" ;;
              *)
                echo "❌ Unknown LLM_PROVIDER: '$PROVIDER' (set LLM_BASE_URL or use MINIMAX | ZAI | ANTHROPIC)" >&2
                exit 1
                ;;
            esac
          else
            # LLM_BASE_URL wins — infer provider so model defaults match the endpoint
            case "$BASE_URL" in
              *z.ai*) PROVIDER="ZAI" ;;
              *minimax*) PROVIDER="MINIMAX" ;;
              *anthropic.com*) PROVIDER="ANTHROPIC" ;;
            esac
          fi

          case "$PROVIDER" in
            MINIMAX)   MODEL_DEFAULT="MiniMax-M2.7" ;;
            ZAI)       MODEL_DEFAULT="glm-5.1" ;;
            ANTHROPIC) MODEL_DEFAULT="claude-sonnet-4-6" ;;
            *)         MODEL_DEFAULT="glm-5.1" ;;
          esac

          MODEL=$(echo "${LLM_MODEL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          MODEL="${MODEL:-$MODEL_DEFAULT}"

          # z.ai expects lowercase glm-* model IDs in Claude Code
          case "$PROVIDER" in
            ZAI) MODEL=$(echo "$MODEL" | tr '[:upper:]' '[:lower:]') ;;
          esac

          # Org secrets often drift (e.g. MiniMax model left after switching to ZAI)
          case "$PROVIDER" in
            ZAI)
              if echo "$MODEL" | grep -qiE 'minimax|claude'; then
                echo "⚠ LLM_MODEL '$MODEL' incompatible with ZAI — using $MODEL_DEFAULT" >&2
                MODEL="$MODEL_DEFAULT"
              fi
              ;;
            MINIMAX)
              if echo "$MODEL" | grep -qiE '^glm|claude'; then
                echo "⚠ LLM_MODEL '$MODEL' incompatible with MINIMAX — using $MODEL_DEFAULT" >&2
                MODEL="$MODEL_DEFAULT"
              fi
              ;;
            ANTHROPIC)
              if echo "$MODEL" | grep -qiE '^glm|minimax'; then
                echo "⚠ LLM_MODEL '$MODEL' incompatible with ANTHROPIC — using $MODEL_DEFAULT" >&2
                MODEL="$MODEL_DEFAULT"
              fi
              ;;
          esac

          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "model=$MODEL"       >> $GITHUB_OUTPUT
          echo "✓ Provider: $PROVIDER | Model: $MODEL @ $BASE_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache claude-code + codebase-ai
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules/@anthropic-ai
            /usr/local/lib/node_modules/codebase-ai
          key: npm-global-claude-${{ runner.os }}-v1
          restore-keys: npm-global-claude-${{ runner.os }}-

      - name: Install claude-code + codebase-ai
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: sudo npm install -g @anthropic-ai/claude-code@latest codebase-ai@latest

      - name: Link cached binaries
        if: steps.npm-cache.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf /usr/local/lib/node_modules/@anthropic-ai/claude-code/bin/claude /usr/local/bin/claude 2>/dev/null || true
          sudo ln -sf /usr/local/lib/node_modules/codebase-ai/bin/codebase /usr/local/bin/codebase-ai 2>/dev/null || true

      - name: Determine context
        id: ctx
        run: |
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            audit)
              BASE="${{ github.event.before }}"
              if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
                BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.sha }}")
              fi
              echo "base=$BASE" >> $GITHUB_OUTPUT
              echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
              ;;
            pr-review)
              echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
              echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
              echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
              ;;
            issue-triage|issue-fix)
              echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
              echo "base=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              echo "head=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Truncate large diffs
        if: inputs.mode == 'pr-review' || inputs.mode == 'audit'
        run: |
          BASE="${{ steps.ctx.outputs.base }}"
          HEAD="${{ steps.ctx.outputs.head }}"
          DIFF=$(git diff --no-color "$BASE".."$HEAD" 2>/dev/null || echo "")
          LINE_COUNT=$(echo "$DIFF" | wc -l)
          echo "Diff size: $LINE_COUNT lines"
          if [ "$LINE_COUNT" -gt 500 ]; then
            echo "$DIFF" | head -500 > /tmp/diff.patch
            echo "" >> /tmp/diff.patch
            echo "... [diff truncated at 500 lines — $LINE_COUNT total. Review largest files manually.]" >> /tmp/diff.patch
            echo "Diff truncated to 500 lines"
          else
            echo "$DIFF" > /tmp/diff.patch
          fi

      - name: Run code reviewer
        continue-on-error: ${{ inputs.fail_on == 'NEVER' }}
        uses: ZySec-AI/code-reviewer@develop
        with:
          mode: ${{ inputs.mode }}
          anthropic-base-url: ${{ steps.provider.outputs.base_url }}
          anthropic-auth-token: ${{ secrets.LLM_API_KEY }}
          llm-model: ${{ steps.provider.outputs.model }}
          github-token: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}
          base-sha: ${{ steps.ctx.outputs.base }}
          head-sha: ${{ steps.ctx.outputs.head }}
          pr-number: ${{ steps.ctx.outputs.pr_number }}
          issue-number: ${{ steps.ctx.outputs.issue_number }}
          fail-on: ${{ inputs.fail_on }}
