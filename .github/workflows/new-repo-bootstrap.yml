name: bootstrap new repositories

on:
  schedule:
    - cron: '0 7 * * 1'    # weekly Monday 07:00 UTC — drift-correct branch protection
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/new-repo-bootstrap.yml'
      - 'workflow-templates/*.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-new-repos
  cancel-in-progress: false

jobs:
  bootstrap:
    # GitHub-hosted on purpose. This workflow runs *in* ZySec-AI/.github, which
    # is a public repository, and runner group 4 (the zysec-ai-ci runners) sets
    # allows_public_repositories=false — so a self-hosted job here queues for
    # ever. The oldest such run sat unstarted for 31 hours. These are API
    # scripts, not builds, and GitHub-hosted minutes are free for public repos.
    # The _reusable-*.yml workflows keep self-hosted: they run in the caller's
    # context, which is a private repo with access to group 4.
    runs-on: ubuntu-latest
    steps:
      - name: Verify token
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          # Requires ORG_ADMIN_TOKEN with visibility=All repositories
          # and scopes: repo, workflow, admin:org
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORG_ADMIN_TOKEN is empty or not visible to this repo."
            exit 1
          fi
          gh auth status

      - name: Find and bootstrap repos
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          REPOS=$(gh api --paginate /orgs/ZySec-AI/repos \
            --jq '.[] | select(.archived==false) | .name')

          # Standard workflow templates — must match workflow-templates/ in this repo.
          # Bootstrap installs missing ones only; never overwrites existing.
          declare -A WORKFLOWS=(
            ["quality.yml"]="lint + type-check + coverage (org reusable)"
            ["security.yml"]="gitleaks + SAST + trivy + dep-review (org reusable)"
            ["hotfix-security.yml"]="fast/full security gate on release PRs"
            ["check-license.yml"]="block GPL/AGPL/SSPL license text in diff"
            ["release.yml"]="QA gate + GitHub Release + Teams notification"
            ["code-review.yml"]="post-merge AI audit on develop"
            ["code-review-pr.yml"]="AI PR review on develop PRs"
            ["issue-triage.yml"]="AI issue triage on opened/reopened"
            ["issue-auto-fix.yml"]="AI auto-fix on agent:ready-for-dev label"
            ["branch-flow-check.yml"]="branch naming + merge flow validation"
            ["pr-standards.yml"]="PR description + type label validation"
            ["merge-comment.yml"]="PR checklist comment on develop PRs"
            ["dependabot-auto-merge.yml"]="auto-approve + merge Dependabot patch/minor"
            ["stale.yml"]="stale PR/issue notifier"
            ["code-freeze.yml"]="weekly code freeze reminders"
            ["sprint-retro.yml"]="weekly sprint retro issue"
            ["docs-to-wiki.yml"]="sync docs/ to GitHub Wiki"
          )

          apply_branch_protection() {
            local REPO="$1"

            # develop: PR validation + quality + secret scan must pass
            # Status check names: reusable jobs report as "job-key / Job Name",
            # inline jobs report as the job's `name:` field value.
            DEVELOP_EXISTS=$(gh api "/repos/ZySec-AI/$REPO/branches/develop" --silent 2>/dev/null && echo yes || echo no)
            if [ "$DEVELOP_EXISTS" = "yes" ]; then
              gh api -X PUT "/repos/ZySec-AI/$REPO/branches/develop/protection" \
                --input - << 'PAYLOAD'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "branch-checks / Branch name + merge flow",
                "validate / Validate PR metadata",
                "gates / Quality Gate",
                "scan / Secret Scan (gitleaks)"
              ]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true,
            "required_linear_history": false
          }
          PAYLOAD
              echo "  ✓ develop — branch protection applied"
            fi

            # release: develop checks + full security gate + AI review
            RELEASE_EXISTS=$(gh api "/repos/ZySec-AI/$REPO/branches/release" --silent 2>/dev/null && echo yes || echo no)
            if [ "$RELEASE_EXISTS" = "yes" ]; then
              gh api -X PUT "/repos/ZySec-AI/$REPO/branches/release/protection" \
                --input - << 'PAYLOAD'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "branch-checks / Branch name + merge flow",
                "validate / Validate PR metadata",
                "gates / Quality Gate",
                "scan / Secret Scan (gitleaks)",
                "full-security / Full Security Gate (non-hotfix)",
                "AI Code Review (blocking on HIGH+)"
              ]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true,
            "required_linear_history": false
          }
          PAYLOAD
              echo "  ✓ release — branch protection applied"
            fi
          }

          # develop/stage/release on every repo. Bootstrap previously created
          # only develop, so 11 repositories were missing stage and/or release
          # and had to be fixed by hand on 2026-09-09.
          ensure_branches() {
            local REPO="$1"
            local SHA
            SHA=$(gh api "/repos/ZySec-AI/$REPO/git/refs/heads/develop" --jq '.object.sha' 2>/dev/null || echo "")
            [ -z "$SHA" ] && return 0
            for B in stage release; do
              if ! gh api "/repos/ZySec-AI/$REPO/branches/$B" --silent >/dev/null 2>&1; then
                gh api -X POST "/repos/ZySec-AI/$REPO/git/refs" \
                  -f ref="refs/heads/$B" -f sha="$SHA" >/dev/null 2>&1 \
                  && echo "  ✓ $B branch created"
              fi
            done
          }

          # Dependabot's version-update config. GitHub reads .github/dependabot.yml
          # only from each repository — there is no organisation-level version and
          # no inheritance, which is why this has to be written per repo. Alerts
          # and security updates ARE org-level and need nothing here.
          #
          # Ecosystems are detected from marker files at the root; a config naming
          # an ecosystem the repo does not use is silently ignored by Dependabot,
          # but detecting keeps the file honest and reviewable.
          #
          # labels: ["dependencies"] is deliberate — it is in the org taxonomy
          # (labels.yml), so sync-labels.yml keeps it and every automated bump is
          # filterable. Leaving it unset makes Dependabot invent the label anyway.
          ensure_dependabot_config() {
            local REPO="$1"
            gh api "/repos/ZySec-AI/$REPO/contents/.github/dependabot.yml" --silent >/dev/null 2>&1 && return 0

            local TREE ECOS=""
            TREE=$(gh api "/repos/ZySec-AI/$REPO/git/trees/develop" --jq '[.tree[]|select(.type=="blob")|.path]|join(" ")' 2>/dev/null || echo "")
            case "$TREE" in *package.json*)   ECOS="$ECOS npm";; esac
            case "$TREE" in *requirements.txt*|*pyproject.toml*|*setup.py*) ECOS="$ECOS pip";; esac
            case "$TREE" in *go.mod*)         ECOS="$ECOS gomod";; esac
            case "$TREE" in *Cargo.toml*)     ECOS="$ECOS cargo";; esac
            case "$TREE" in *Gemfile*)        ECOS="$ECOS bundler";; esac
            case "$TREE" in *composer.json*)  ECOS="$ECOS composer";; esac
            case "$TREE" in *Dockerfile*)     ECOS="$ECOS docker";; esac

            local BODY="version: 2\nupdates:\n"
            for E in $ECOS; do
              BODY="$BODY  - package-ecosystem: \"$E\"\n    directory: \"/\"\n    schedule:\n      interval: \"weekly\"\n      day: \"monday\"\n      time: \"03:00\"\n      timezone: \"UTC\"\n    open-pull-requests-limit: 10\n    labels: [\"dependencies\"]\n    commit-message:\n      prefix: \"deps\"\n    groups:\n      minor-and-patch:\n        update-types:\n          - \"minor\"\n          - \"patch\"\n    reviewers:\n      - \"ZySec-AI/org-maintenance\"\n\n"
            done
            # github-actions applies to every repository that has workflows.
            BODY="$BODY  - package-ecosystem: \"github-actions\"\n    directory: \".github/workflows\"\n    schedule:\n      interval: \"weekly\"\n      day: \"monday\"\n      time: \"03:00\"\n      timezone: \"UTC\"\n    open-pull-requests-limit: 5\n    labels: [\"dependencies\"]\n    commit-message:\n      prefix: \"ci\"\n    groups:\n      actions:\n        update-types:\n          - \"minor\"\n          - \"patch\"\n"

            local ENCODED
            ENCODED=$(printf '%b' "$BODY" | base64 -w0)
            gh api -X PUT "/repos/ZySec-AI/$REPO/contents/.github/dependabot.yml" \
              -f message="chore: add Dependabot config (bootstrap)" \
              -f content="$ENCODED" -f branch=develop >/dev/null 2>&1 \
              && echo "  ✓ dependabot.yml created (${ECOS:- } github-actions)"
          }

          BOOTSTRAPPED=0
          UPDATED=0
          PROTECTED=0
          SKIPPED=0

          for REPO in $REPOS; do
            NEEDS_TEAMS=false
            NEEDS_WORKFLOW=false

            # Team permission check — single API call
            CURRENT=$(gh api "/repos/ZySec-AI/$REPO/teams" \
              --jq '.[] | select(.slug=="org-admins") | .permission' 2>/dev/null || echo "")
            [ "$CURRENT" != "admin" ] && NEEDS_TEAMS=true

            # Bulk-fetch existing workflow filenames in one API call
            EXISTING_WFS=$(gh api "/repos/ZySec-AI/$REPO/contents/.github/workflows" \
              --jq '.[].name' 2>/dev/null || echo "")

            for WF in "${!WORKFLOWS[@]}"; do
              if ! echo "$EXISTING_WFS" | grep -qx "$WF"; then
                NEEDS_WORKFLOW=true
                break
              fi
            done

            if ! $NEEDS_TEAMS && ! $NEEDS_WORKFLOW; then
              SKIPPED=$((SKIPPED+1))
              # Still run protection drift-correct on Monday schedule
              if [ "$(date +%u)" = "1" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                apply_branch_protection "$REPO" && PROTECTED=$((PROTECTED+1)) || true
              fi
              continue
            fi

            echo ""
            echo "→ Bootstrapping ZySec-AI/$REPO (teams=$NEEDS_TEAMS, workflows=$NEEDS_WORKFLOW)"

            if $NEEDS_TEAMS; then
              gh api -X PUT "/orgs/ZySec-AI/teams/org-admins/repos/ZySec-AI/$REPO" \
                -f permission=admin >/dev/null 2>&1 && echo "  ✓ org-admins → admin" || echo "  ⚠ org-admins team assignment skipped (403)"
              gh api -X PUT "/orgs/ZySec-AI/teams/org-maintenance/repos/ZySec-AI/$REPO" \
                -f permission=maintain >/dev/null 2>&1 && echo "  ✓ org-maintenance → maintain" || true
              gh api -X PUT "/orgs/ZySec-AI/teams/org-secops/repos/ZySec-AI/$REPO" \
                -f permission=triage >/dev/null 2>&1 && echo "  ✓ org-secops → triage" || true

              gh api -X PATCH "/repos/ZySec-AI/$REPO" \
                -F delete_branch_on_merge=true \
                -F has_wiki=false \
                -F allow_squash_merge=true \
                -F allow_merge_commit=false \
                -F allow_rebase_merge=false \
                -F allow_auto_merge=true \
                -F allow_update_branch=true \
                -F squash_merge_commit_title=PR_TITLE \
                -F squash_merge_commit_message=PR_BODY \
                -F web_commit_signoff_required=true >/dev/null 2>&1 \
                && echo "  ✓ standardised repo settings" || echo "  ⚠ repo settings skipped (403)"

              # Ensure default branch is develop
              DEFAULT=$(gh api "/repos/ZySec-AI/$REPO" --jq '.default_branch')
              if [ "$DEFAULT" != "develop" ]; then
                CURRENT_SHA=$(gh api "/repos/ZySec-AI/$REPO/git/refs/heads/$DEFAULT" \
                  --jq '.object.sha' 2>/dev/null || echo "")
                if [ -n "$CURRENT_SHA" ]; then
                  gh api -X POST "/repos/ZySec-AI/$REPO/git/refs" \
                    -f ref=refs/heads/develop \
                    -f sha="$CURRENT_SHA" 2>/dev/null || true
                  gh api -X PATCH "/repos/ZySec-AI/$REPO" \
                    -f default_branch=develop >/dev/null && echo "  ✓ default branch → develop"
                fi
              fi

              BOOTSTRAPPED=$((BOOTSTRAPPED+1))
            fi

            # Branches before protection: a rule cannot attach to a ref that
            # does not exist yet.
            ensure_branches "$REPO"
            ensure_dependabot_config "$REPO"

            # Apply branch protection on every bootstrap (new repos need it)
            apply_branch_protection "$REPO" && PROTECTED=$((PROTECTED+1)) || true

            if $NEEDS_WORKFLOW; then
              TARGET_BRANCH=$(gh api "/repos/ZySec-AI/$REPO" --jq '.default_branch')

              for WF in "${!WORKFLOWS[@]}"; do
                # Skip if already present (use the bulk-fetched list)
                if echo "$EXISTING_WFS" | grep -qx "$WF"; then
                  continue
                fi

                # Fetch template content via git tree for accurate SHA
                CONTENT=$(gh api "/repos/ZySec-AI/.github/contents/workflow-templates/$WF?ref=develop" \
                  --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

                if [ -z "$CONTENT" ]; then
                  echo "  ⚠ template $WF not found in .github repo, skipping"
                  continue
                fi

                ENCODED=$(printf '%s' "$CONTENT" | base64 -w0)

                gh api -X PUT "/repos/ZySec-AI/$REPO/contents/.github/workflows/$WF" \
                  -f message="ci: install $WF [bootstrap]" \
                  -f content="$ENCODED" \
                  -f branch="$TARGET_BRANCH" >/dev/null 2>&1 \
                  && echo "  ✓ installed $WF" \
                  || echo "  ⚠ failed to install $WF (may need write access)"
              done

              UPDATED=$((UPDATED+1))
            fi
          done

          echo ""
          echo "═══════════════════════════════════════════"
          echo "Bootstrapped (settings+teams): $BOOTSTRAPPED"
          echo "Updated (workflows installed): $UPDATED"
          echo "Branch protection applied:     $PROTECTED"
          echo "Already up-to-date:            $SKIPPED"
          echo "═══════════════════════════════════════════"
