name: Reusable Tests

on:
  workflow_call:

    # ============================================================
    # INPUTS
    # ============================================================

    inputs:

      runs_on:
        description: "JSON array of GitHub Actions runner labels"
        required: false
        type: string
        default: '["self-hosted","linux","x64","zysec-ai-ci"]'

      test_mode:
        description: "Tests to run: unit, playwright, or both"
        required: true
        type: string

      unit_test_path:
        description: "Path to unit tests"
        required: false
        type: string
        default: "tests/unit"

      e2e_test_path:
        description: "Path to Playwright E2E tests"
        required: false
        type: string
        default: "tests/e2e"

      playwright_config:
        description: "Playwright configuration file"
        required: false
        type: string
        default: "playwright.config.ts"

      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"

      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"

      playwright_browser:
        description: "Playwright browser"
        required: false
        type: string
        default: "chromium"

      install_playwright_deps:
        description: "Install Playwright OS dependencies"
        required: false
        type: boolean
        default: true

      working_directory:
        description: "Application directory"
        required: false
        type: string
        default: "."

      database:
        description: "Database mode: auto, mongodb, or none"
        required: false
        type: string
        default: "auto"

      unit_command:
        description: "Custom unit-test command"
        required: false
        type: string
        default: ""

      pnpm_version:
        description: "pnpm version used when package.json does not declare packageManager"
        required: false
        type: string
        default: ""

      secondary_playwright_config:
        description: "Optional second Playwright configuration"
        required: false
        type: string
        default: ""

      playwright_command:
        description: "Optional Playwright command. Replaces the built-in playwright test invocation."
        required: false
        type: string
        default: ""

      playwright_target:
        description: "local starts from the repo Playwright config. remote uses playwright_base_url and does not require Docker."
        required: false
        type: string
        default: "local"

      playwright_base_url:
        description: "Deployed application URL. Used only when playwright_target is remote."
        required: false
        type: string
        default: ""

      node_required:
        description: "Fail when no Node project and no Python project is detected"
        required: false
        type: boolean
        default: true

      configure_private_deps:
        description: "Before install, run the caller .github/actions/configure-private-deps action and scripts/ci-pnpm-install.sh. Other repos leave this false."
        required: false
        type: boolean
        default: false

      timeout_minutes:
        description: "Job timeout in minutes. Org default is 300 (5 hours)."
        required: false
        type: number
        default: 300

      playwright_prepare_command:
        description: "Optional shell run before Mongo/Next/Playwright (builds, seeds, asset prep)."
        required: false
        type: string
        default: ""

      playwright_env:
        description: "Optional non-secret KEY=value lines exported before Playwright."
        required: false
        type: string
        default: ""

      playwright_start_mongodb:
        description: "Start a disposable MongoDB container and export MONGODB_URI before Playwright."
        required: false
        type: boolean
        default: false

      playwright_mongodb_image:
        description: "MongoDB image when playwright_start_mongodb is true."
        required: false
        type: string
        default: "mongo:8.0"

      playwright_mongodb_replica_set:
        description: "Initialize a one-node replica set (required by some apps)."
        required: false
        type: boolean
        default: false

      playwright_mongodb_db_name:
        description: "Optional database name. Sets MONGODB_DB_NAME and appends to MONGODB_URI path."
        required: false
        type: string
        default: ""

      playwright_app_port:
        description: "App port for local Next. Empty picks a free port. Use 3000 when tests hardcode localhost:3000."
        required: false
        type: string
        default: ""

      playwright_next_command:
        description: "Optional command to start the app server in the background. Use $PLAYWRIGHT_APP_PORT for the port."
        required: false
        type: string
        default: ""

      playwright_health_url:
        description: "URL to wait on after starting Next. Use $PLAYWRIGHT_APP_PORT in the string."
        required: false
        type: string
        default: ""

      playwright_health_grep:
        description: "If set, health check passes when the response body contains this text. Otherwise HTTP 200 is enough."
        required: false
        type: string
        default: ""

    # ============================================================
    # SECRETS
    # ============================================================

    secrets:

      ORG_ADMIN_TOKEN:
        description: "Token used for private Git dependencies"
        required: false

      GH_PAT:
        description: "Optional token with read access to private Git dependencies. Used when configure_private_deps is true."
        required: false

      # Optional dotenv body (KEY=value per line). Callers pass it with
      # secrets: inherit. Every line becomes an env var before Playwright.
      # GitHub cannot list all repo secrets, so one blob replaces per-key
      # edits in this shared workflow. Leave unset in repos that need none.
      TEST_ENV:
        required: false

# ==================================================================
# JOB
# ==================================================================

jobs:

  quality-gates:

    name: Quality Gates

    runs-on: ${{ fromJSON(inputs.runs_on) }}

    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VALIDATE TEST MODE
      # ============================================================

      - name: Validate test mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.test_mode }}"

          case "$MODE" in
            unit|playwright|both)
              ;;
            *)
              echo "::error::Invalid test mode: $MODE"
              echo "::error::Expected: unit, playwright, or both."
              exit 1
              ;;
          esac

          case "${{ inputs.database }}" in
            auto|mongodb|none)
              ;;
            *)
              echo "::error::Invalid database: ${{ inputs.database }}"
              echo "::error::Expected: auto, mongodb, or none."
              exit 1
              ;;
          esac

          case "${{ inputs.playwright_target }}" in
            local|remote)
              ;;
            *)
              echo "::error::Invalid playwright_target: ${{ inputs.playwright_target }}"
              echo "::error::Expected: local or remote."
              exit 1
              ;;
          esac

          if [ "$MODE" = "playwright" ] || [ "$MODE" = "both" ]; then
            if [ "${{ inputs.playwright_target }}" = "remote" ]; then
              case "${{ inputs.playwright_base_url }}" in
                http://*|https://*)
                  ;;
                *)
                  echo "::error::Remote Playwright requires playwright_base_url to be an http or https URL."
                  exit 1
                  ;;
              esac
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Test Configuration"
          echo "========================================"
          echo "Mode:               $MODE"
          echo "Unit test path:     ${{ inputs.unit_test_path }}"
          echo "E2E test path:      ${{ inputs.e2e_test_path }}"
          echo "Playwright config:  ${{ inputs.playwright_config }}"
          echo "Node version:       ${{ inputs.node_version }}"
          echo "Python version:     ${{ inputs.python_version }}"
          echo "Playwright browser: ${{ inputs.playwright_browser }}"
          echo "Working directory:  ${{ inputs.working_directory }}"
          echo "Database input:     ${{ inputs.database }}"
          echo "========================================"

      # ============================================================
      # RESOLVE APP PATHS
      # ============================================================

      - name: Resolve app paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${{ inputs.working_directory }}"
          APP_DIR="${APP_DIR%/}"

          if [ -z "$APP_DIR" ]; then
            APP_DIR="."
          fi

          UNIT_DIR="$APP_DIR/${{ inputs.unit_test_path }}"
          E2E_DIR="$APP_DIR/${{ inputs.e2e_test_path }}"

          {
            echo "APP_DIR=$APP_DIR"
            echo "UNIT_DIR=$UNIT_DIR"
            echo "E2E_DIR=$E2E_DIR"
          } >> "$GITHUB_ENV"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "App directory: $APP_DIR"
          echo "Unit directory: $UNIT_DIR"
          echo "E2E directory: $E2E_DIR"

      # ============================================================
      # DETECT APPLICATION DATABASE
      # ============================================================

      - name: Detect application database
        id: detect-database
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ inputs.database }}"

          if [ "$REQUESTED" != "auto" ]; then
            echo "database=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "Database forced by caller: $REQUESTED"
            exit 0
          fi

          found_mongo=0
          found_falkor=0
          found_minio=0
          found_clickhouse=0

          while IFS= read -r file; do

            [ -f "$file" ] || continue

            if grep -Eiq 'mongodb|image:[[:space:]]*mongo' "$file"; then
              found_mongo=1
            fi

            if grep -Eiq 'falkordb|falkor' "$file"; then
              found_falkor=1
            fi

            if grep -Eiq 'minio' "$file"; then
              found_minio=1
            fi

            if grep -Eiq 'clickhouse' "$file"; then
              found_clickhouse=1
            fi

          done < <(
            find "$APP_DIR" -type f \
              \( \
                -name 'docker-compose*.yml' \
                -o -name 'docker-compose*.yaml' \
                -o -name 'compose.yml' \
                -o -name 'compose.yaml' \
              \) \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*'
          )

          noted=""

          [ "$found_falkor" -eq 1 ] && noted="${noted} falkordb"
          [ "$found_minio" -eq 1 ] && noted="${noted} minio"
          [ "$found_clickhouse" -eq 1 ] && noted="${noted} clickhouse"

          noted="${noted# }"

          echo "noted=$noted" >> "$GITHUB_OUTPUT"

          if [ -n "$noted" ]; then
            echo "Recognized supporting services with no test block yet: $noted"
          fi

          if [ "$found_mongo" -eq 1 ]; then
            selected="mongodb"
          else
            selected="none"
          fi

          echo "database=$selected" >> "$GITHUB_OUTPUT"

          echo "Detected application database: $selected"

      # ============================================================
      # CONFIGURE DATABASE
      # ============================================================

      - name: Configure selected database
        shell: bash
        run: |
          set -euo pipefail

          case "${{ steps.detect-database.outputs.database }}" in

            mongodb|none)

              echo "RELATADB_REQUIRED=0" >> "$GITHUB_ENV"

              echo "No database service is started for ${{ steps.detect-database.outputs.database }}."

              ;;

          esac

      # ============================================================
      # DETECT ROOT NODE PACKAGE MANAGER
      # ============================================================

      - name: Detect root Node package manager
        id: package-manager
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          APP="$APP_DIR"

          is_python_dir() {
            [ -f "$1/pyproject.toml" ] ||
            [ -f "$1/pytest.ini" ] ||
            [ -f "$1/requirements.txt" ]
          }

          if [ -f "$APP/pnpm-lock.yaml" ]; then

            # A Python app can keep a stub package.json for the org quality
            # gate. uv.lock plus pyproject.toml is the test project when that
            # manifest does not declare a package manager.
            if [ -f "$APP/uv.lock" ] && [ -f "$APP/pyproject.toml" ] &&
               { [ ! -f "$APP/package.json" ] || ! grep -q '"packageManager"' "$APP/package.json"; }; then
              PM="none"
            else
              PM="pnpm"
            fi

          elif [ -f "$APP/yarn.lock" ]; then

            PM="yarn"

          elif [ -f "$APP/package-lock.json" ]; then

            PM="npm"

          elif [ -f "$APP/package.json" ]; then

            echo "::error::package.json exists but no lockfile was found in $APP."
            exit 1

          elif is_python_dir "$APP" || is_python_dir "$UNIT_DIR"; then

            PM="none"

          elif [ "${{ inputs.node_required }}" = "true" ]; then

            echo "::error::No supported Node package configuration found in $APP."
            exit 1

          else

            PM="none"

          fi

          echo "pm=$PM" >> "$GITHUB_OUTPUT"

          echo "Detected root package manager: $PM"

      # ============================================================
      # SETUP NODE
      # ============================================================

      - name: Setup Node.js
        if: |
          steps.package-manager.outputs.pm != 'none' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # ============================================================
      # ENABLE COREPACK
      # ============================================================

      - name: Enable Corepack
        if: |
          steps.package-manager.outputs.pm == 'pnpm' ||
          steps.package-manager.outputs.pm == 'yarn'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable

      # ============================================================
      # DETECT ROOT PNPM VERSION
      # ============================================================

      - name: Detect root pnpm version
        if: steps.package-manager.outputs.pm == 'pnpm'
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ inputs.working_directory }}"

          VERSION="${{ inputs.pnpm_version }}"

          if [ -z "$VERSION" ]; then
            VERSION="$(
              node -pe '
                const pkg = require("./package.json");
                const value = pkg.packageManager || "";
                value.startsWith("pnpm@") ? value.substring(5) : "";
              '
            )"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::package.json must declare a pnpm version, or the caller must set pnpm_version."
            echo "::error::Example: \"packageManager\": \"pnpm@9.15.0\""
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP ROOT PNPM
      # ============================================================

      - name: Setup root pnpm
        if: steps.package-manager.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # ============================================================
      # CHECK UNIT TEST DIRECTORY
      # ============================================================

      - name: Check unit test directory
        id: check-unit-tests
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$UNIT_DIR" ]; then
            echo "::error::Required unit test directory '$UNIT_DIR' does not exist."
            exit 1
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DETECT UNIT TEST TYPE / PACKAGE MANAGER
      # ============================================================

      - name: Detect unit-test package manager
        id: unit-package-manager
        if: |
          inputs.unit_command == '' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          ) &&
          steps.check-unit-tests.outputs.present == 'true'
        shell: bash
        env:
          ROOT_PM: ${{ steps.package-manager.outputs.pm }}
        run: |
          set -euo pipefail

          ROOT_DIR="$APP_DIR"
          UNIT_PATH="$UNIT_DIR"

          detect_node_pm() {
            local DIR="$1"

            if [ -f "$DIR/pnpm-lock.yaml" ]; then
              echo "pnpm"
            elif [ -f "$DIR/yarn.lock" ]; then
              echo "yarn"
            elif [ -f "$DIR/package-lock.json" ]; then
              echo "npm"
            else
              echo ""
            fi
          }

          if [ -f "$UNIT_PATH/package.json" ]; then

            PM="$(detect_node_pm "$UNIT_PATH")"

            if [ -z "$PM" ]; then
              echo "::error::Node unit-test project found at '$UNIT_PATH', but no lockfile was found."
              exit 1
            fi

            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "pm=$PM" >> "$GITHUB_OUTPUT"
            echo "location=nested" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          if [ -f "$UNIT_PATH/pytest.ini" ] ||
             [ -f "$UNIT_PATH/pyproject.toml" ] ||
             [ -f "$UNIT_PATH/requirements.txt" ]; then

            echo "type=python" >> "$GITHUB_OUTPUT"
            echo "pm=python" >> "$GITHUB_OUTPUT"
            echo "location=nested" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          if [ -f "$ROOT_DIR/package.json" ]; then

            PM="${ROOT_PM:-}"

            if [ -z "$PM" ]; then
              PM="$(detect_node_pm "$ROOT_DIR")"
            fi

            if [ -z "$PM" ]; then
              echo "::error::App package.json exists but no lockfile was found in $ROOT_DIR."
              exit 1
            fi

            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "pm=$PM" >> "$GITHUB_OUTPUT"
            echo "location=root" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          if [ -f "$ROOT_DIR/pytest.ini" ] ||
             [ -f "$ROOT_DIR/pyproject.toml" ] ||
             [ -f "$ROOT_DIR/requirements.txt" ]; then

            echo "type=python" >> "$GITHUB_OUTPUT"
            echo "pm=python" >> "$GITHUB_OUTPUT"
            echo "location=root" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "::error::Unable to detect unit-test runner."
          exit 1

      # ============================================================
      # DETECT UNIT PNPM VERSION
      # ============================================================

      - name: Detect unit-test pnpm version
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'pnpm' &&
          steps.unit-package-manager.outputs.location == 'nested'
        id: unit-pnpm-version
        shell: bash
        run: |
          set -euo pipefail

          cd "$UNIT_DIR"

          VERSION="$(
            node -pe '
              const pkg = require("./package.json");
              const value = pkg.packageManager || "";
              value.startsWith("pnpm@") ? value.substring(5) : "";
            '
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::Unit-test package.json must declare its pnpm version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP UNIT PNPM
      # ============================================================

      - name: Setup unit-test pnpm
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'pnpm' &&
          steps.unit-package-manager.outputs.location == 'nested'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.unit-pnpm-version.outputs.version }}

      # ============================================================
      # ENABLE UNIT YARN
      # ============================================================

      - name: Enable unit-test Yarn
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'yarn' &&
          steps.unit-package-manager.outputs.location == 'nested'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable

      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        if: steps.unit-package-manager.outputs.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # ============================================================
      # PRIVATE GIT DEPENDENCIES
      #
      # Opt-in. A uses: job cannot run the caller's local action
      # itself, and a relative uses: path would resolve in this
      # .github repo. The caller's action script runs here, in
      # the caller checkout, then ci-pnpm-install.sh links it.
      # ============================================================

      - name: Configure private Git dependencies
        if: |
          inputs.configure_private_deps &&
          steps.package-manager.outputs.pm != 'none' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.ORG_ADMIN_TOKEN }}
          ACTION_FILE: ${{ github.workspace }}/.github/actions/configure-private-deps/action.yml
        run: |
          set -euo pipefail
          if [ ! -f "$ACTION_FILE" ]; then
            echo "::error::configure_private_deps requires .github/actions/configure-private-deps/action.yml in the caller repository."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.env.ACTION_FILE, "utf8").split(/\r?\n/);
          const start = lines.findIndex((line) => line === "      run: |");
          if (start < 0) {
            console.error("::error::Could not find the configure-private-deps run script.");
            process.exit(1);
          }
          const body = [];
          for (const line of lines.slice(start + 1)) {
            if (line.startsWith("        ")) body.push(line.slice(8));
            else if (line.trim() === "") body.push("");
            else break;
          }
          if (!body.some((line) => line.includes("set -euo pipefail"))) {
            console.error("::error::configure-private-deps run script was not extracted.");
            process.exit(1);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/configure-private-deps.sh`, `${body.join("\n")}\n`);
          NODE
          cd "${{ inputs.working_directory }}"
          bash "$RUNNER_TEMP/configure-private-deps.sh"

      # ============================================================
      # INSTALL ROOT NODE DEPENDENCIES
      # ============================================================

      - name: Install root Node dependencies
        if: |
          steps.package-manager.outputs.pm != 'none' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ inputs.working_directory }}"

          case "${{ steps.package-manager.outputs.pm }}" in

            pnpm)
              if [ "${{ inputs.configure_private_deps }}" = "true" ]; then
                GIT_TERMINAL_PROMPT=0 bash scripts/ci-pnpm-install.sh
              else
                pnpm install --frozen-lockfile
              fi
              ;;

            yarn)
              yarn install --immutable
              ;;

            npm)
              npm ci
              ;;

            *)
              echo "::error::Unsupported package manager."
              exit 1
              ;;

          esac

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python unit-test dependencies
        if: steps.unit-package-manager.outputs.type == 'python'
        shell: bash
        env:
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_DIR"
          else
            cd "$APP_DIR"
          fi

          if [ -f requirements.txt ]; then

            python -m pip install -r requirements.txt

          elif [ -f pyproject.toml ]; then

            python -m pip install -e .

          elif [ -f pytest.ini ]; then

            python -m pip install pytest

          else

            echo "::error::No supported Python dependency configuration found."
            exit 1

          fi

      # ============================================================
      # INSTALL NESTED NODE UNIT DEPENDENCIES
      # ============================================================

      - name: Install Node unit-test dependencies
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.location == 'nested'
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail

          cd "$UNIT_DIR"

          case "${{ steps.unit-package-manager.outputs.pm }}" in

            pnpm)
              pnpm install --frozen-lockfile
              ;;

            yarn)
              yarn install --immutable
              ;;

            npm)
              npm ci
              ;;

            *)
              echo "::error::Unsupported unit-test package manager."
              exit 1
              ;;

          esac

      # ============================================================
      # SETUP UV
      #
      # Used when the caller passes unit_command for a uv project.
      # Node package managers stay on their own install step.
      # ============================================================

      - name: Detect uv project
        id: uv-project
        if: |
          inputs.unit_command != '' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$APP_DIR/uv.lock" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.uv-project.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python_version }}
          enable-cache: true

      - name: Sync uv dependencies
        if: steps.uv-project.outputs.present == 'true'
        shell: bash
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          # dev group (cpod-backend, cpod-arai), the test extra (C3 backend),
          # or the dev extra.
          if ! uv sync --frozen --dev; then
            if ! uv sync --frozen --extra test; then
              uv sync --frozen --extra dev
            fi
          fi

      # ============================================================
      # RUN CUSTOM UNIT TESTS
      # ============================================================

      - name: Run custom unit command
        id: custom-unit-tests
        continue-on-error: ${{ steps.mode.outputs.mode == 'both' }}
        if: |
          inputs.unit_command != '' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          )
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          UNIT_COMMAND: ${{ inputs.unit_command }}
        run: |
          set +e
          printf '%s\n' "$UNIT_COMMAND" > "$RUNNER_TEMP/unit-command.sh"
          # A failing command must not skip the later test commands in this step.
          sed -i -E \
            -e 's/^([[:space:]]*)set[[:space:]]+-euo[[:space:]]+pipefail[[:space:]]*$/\1set +e/' \
            -e 's/^([[:space:]]*)set[[:space:]]+-e[[:space:]]*$/\1set +e/' \
            "$RUNNER_TEMP/unit-command.sh"
          (
            unit_fail=0
            trap 'unit_fail=1' ERR
            source "$RUNNER_TEMP/unit-command.sh"
            source_status=$?
            trap - ERR
            if [ "$source_status" -ne 0 ]; then
              unit_fail=1
            fi
            exit "$unit_fail"
          ) 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
          exit "${PIPESTATUS[0]}"

      # ============================================================
      # RUN NODE UNIT TESTS
      # ============================================================

      - name: Run Node unit tests
        id: node-unit-tests
        continue-on-error: ${{ steps.mode.outputs.mode == 'both' }}
        if: |
          always() &&
          inputs.unit_command == '' &&
          steps.unit-package-manager.outputs.type == 'node'
        shell: bash
        env:
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/unit-tests.log") 2>&1

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_DIR"
          else
            cd "$APP_DIR"
          fi

          case "${{ steps.unit-package-manager.outputs.pm }}" in

            pnpm)
              pnpm test
              ;;

            yarn)
              yarn test
              ;;

            npm)
              npm test
              ;;

            *)
              echo "::error::Unsupported unit-test package manager."
              exit 1
              ;;

          esac

      # ============================================================
      # RUN PYTHON UNIT TESTS
      # ============================================================

      - name: Run Python unit tests
        id: python-unit-tests
        continue-on-error: ${{ steps.mode.outputs.mode == 'both' }}
        if: |
          always() &&
          inputs.unit_command == '' &&
          steps.unit-package-manager.outputs.type == 'python'
        shell: bash
        env:
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/unit-tests.log") 2>&1

          if [ "$UNIT_LOCATION" = "nested" ]; then

            cd "$UNIT_DIR"
            python -m pytest .

          else

            cd "$APP_DIR"

            # IMPORTANT:
            # Do not use "$UNIT_DIR" here because UNIT_DIR already
            # contains APP_DIR.
            #
            # Example:
            #   APP_DIR=backend
            #   unit_test_path=tests
            #
            # "$UNIT_DIR" would become:
            #   backend/tests
            #
            # After "cd backend", that would incorrectly resolve to:
            #   backend/backend/tests
            #
            # Use the caller-provided unit_test_path instead.
            python -m pytest "${{ inputs.unit_test_path }}"

          fi

      # ============================================================
      # VERIFY PLAYWRIGHT CONFIGURATION
      # ============================================================

      - name: Verify Playwright configuration
        id: playwright-config
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${{ inputs.working_directory }}/${{ inputs.playwright_config }}"

          if [ ! -f "$CONFIG" ]; then
            echo "Playwright configuration '$CONFIG' is not present. Skipping Playwright."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"

          EXTRA="${{ inputs.secondary_playwright_config }}"

          if [ -n "$EXTRA" ] &&
             [ ! -f "${{ inputs.working_directory }}/$EXTRA" ]; then

            echo "::error::Playwright configuration '${{ inputs.working_directory }}/$EXTRA' does not exist."
            exit 1

          fi

      # ============================================================
      # VERIFY E2E TEST DIRECTORY
      # ============================================================

      - name: Verify E2E test directory
        if: |
          steps.playwright-config.outputs.present == 'true' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          E2E_PATH="${{ inputs.working_directory }}/${{ inputs.e2e_test_path }}"

          if [ ! -d "$E2E_PATH" ]; then
            echo "::error::Playwright test directory '$E2E_PATH' does not exist."
            exit 1
          fi

      # ============================================================
      # VERIFY DOCKER
      # ============================================================

      - name: Verify Docker
        if: |
          steps.playwright-config.outputs.present == 'true' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          ) &&
          (
            inputs.playwright_target != 'remote' ||
            steps.detect-database.outputs.database == 'mongodb'
          )
        shell: bash
        run: |
          set -euo pipefail

          command -v docker >/dev/null 2>&1 || {
            echo "::error::Docker is not available."
            exit 1
          }

          docker --version
          docker compose version

      # ============================================================
      # START MONGODB
      # ============================================================

      - name: Start MongoDB
        if: |
          steps.playwright-config.outputs.present == 'true' &&
          steps.detect-database.outputs.database == 'mongodb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          MONGO_NAME="ci-mongodb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker rm -f "$MONGO_NAME" >/dev/null 2>&1 || true

          docker run \
            -d \
            --name "$MONGO_NAME" \
            -p "127.0.0.1::27017" \
            mongo:8

          echo "CI_MONGO_NAME=$MONGO_NAME" >> "$GITHUB_ENV"

          MONGO_PORT="$(
            docker port "$MONGO_NAME" 27017/tcp |
            awk -F: 'NR==1 { print $NF }'
          )"

          if [ -z "$MONGO_PORT" ]; then
            echo "::error::MongoDB did not publish a host port."
            exit 1
          fi

          for i in $(seq 1 30); do

            if docker exec "$MONGO_NAME" \
              mongosh --quiet \
              --eval "db.adminCommand({ ping: 1 })" \
              >/dev/null 2>&1; then

              echo "MongoDB is ready on port $MONGO_PORT."

              echo "MONGODB_URI=mongodb://127.0.0.1:${MONGO_PORT}/?directConnection=true" \
                >> "$GITHUB_ENV"

              exit 0
            fi

            sleep 1

          done

          echo "::error::MongoDB did not become ready."

          docker logs "$MONGO_NAME" || true

          exit 1

      # ============================================================
      # INSTALL PLAYWRIGHT OS DEPENDENCIES
      # ============================================================

      - name: Install Playwright OS dependencies
        if: |
          steps.playwright-config.outputs.present == 'true' &&
          inputs.install_playwright_deps == true &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          . /etc/os-release

          case "$VERSION_ID" in

            24.04)

              packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
                fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont \
                fonts-wqy-zenhei libasound2t64 libatk-bridge2.0-0t64 \
                libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 \
                libdbus-1-3 libdrm2 libfontconfig1 libfreetype6 libgbm1 \
                libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 \
                libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 xfonts-cyrillic \
                xfonts-scalable xvfb"

              ;;

            22.04)

              packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
                fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont \
                fonts-wqy-zenhei libasound2 libatk-bridge2.0-0 \
                libatk1.0-0 libatspi2.0-0 libcairo2 libcups2 libdbus-1-3 \
                libdrm2 libfontconfig1 libfreetype6 libgbm1 libglib2.0-0 \
                libnspr4 libnss3 libpango-1.0-0 libwayland-client0 \
                libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 xfonts-cyrillic \
                xfonts-scalable xvfb"

              ;;

            *)

              echo "::error::Unsupported runner OS: $PRETTY_NAME"
              exit 1

              ;;

          esac

          sudo apt-get \
            -o DPkg::Lock::Timeout=300 \
            update \
            -qq

          sudo apt-get \
            -o DPkg::Lock::Timeout=300 \
            install \
            -y \
            --no-install-recommends \
            $packages

      # ============================================================
      # INSTALL PLAYWRIGHT BROWSER
      # ============================================================

      - name: Install Playwright browser
        if: |
          steps.playwright-config.outputs.present == 'true' &&
          inputs.playwright_command == '' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          case "${{ steps.package-manager.outputs.pm }}" in

            pnpm)
              pnpm exec playwright install "${{ inputs.playwright_browser }}"
              ;;

            yarn)
              yarn playwright install "${{ inputs.playwright_browser }}"
              ;;

            npm)
              npx --no-install playwright install "${{ inputs.playwright_browser }}"
              ;;

            *)
              echo "::error::Playwright requires a Node package manager in $APP_DIR."
              exit 1
              ;;

          esac

      # ============================================================
      # RUN PLAYWRIGHT
      # ============================================================

      - name: Run Playwright E2E tests
        id: playwright-tests
        if: |
          steps.playwright-config.outputs.present == 'true' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        env:
          PLAYWRIGHT_COMMAND: ${{ inputs.playwright_command }}
          PLAYWRIGHT_PREPARE_COMMAND: ${{ inputs.playwright_prepare_command }}
          PLAYWRIGHT_ENV: ${{ inputs.playwright_env }}
          PLAYWRIGHT_NEXT_COMMAND: ${{ inputs.playwright_next_command }}
          TEST_ENV: ${{ secrets.TEST_ENV }}
        run: |
          set +e
          exec > >(tee "$RUNNER_TEMP/playwright-tests.log") 2>&1

          cd "$APP_DIR"

          ci_mongo_name=""
          ci_next_pid=""
          cleanup_playwright_ci() {
            if [ -n "${ci_next_pid}" ]; then
              kill "$ci_next_pid" >/dev/null 2>&1 || true
            fi
            if [ -n "${ci_mongo_name}" ]; then
              docker rm -f "$ci_mongo_name" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_playwright_ci EXIT

          export_dotenv() {
            local body="$1"
            local label="$2"
            local keys=""
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*)
                  continue
                  ;;
              esac
              key="${line%%=*}"
              value="${line#*=}"
              if [ -n "$key" ] && [ "$key" != "$line" ]; then
                export "$key=$value"
                keys="${keys} ${key}"
              fi
            done < <(printf '%s\n' "$body")
            echo "${label} loaded keys:${keys}"
          }

          # Secrets from the caller repo (TEST_ENV).
          if [ -n "${TEST_ENV:-}" ]; then
            export_dotenv "$TEST_ENV" "TEST_ENV"
            unset TEST_ENV

            # ScaleRisk requires APP_MASTER_SECRET as exactly 64 lowercase
            # hex chars. Repo secrets are often shorter; sha256 always fits.
            if [ -n "${APP_MASTER_SECRET:-}" ]; then
              app_master="$(printf '%s' "$APP_MASTER_SECRET" | tr 'A-F' 'a-f')"
              if printf '%s' "$app_master" | grep -Eq '^[0-9a-f]{64}$'; then
                export APP_MASTER_SECRET="$app_master"
              else
                export APP_MASTER_SECRET="$(printf '%s' "$APP_MASTER_SECRET" | sha256sum | awk '{print $1}')"
                echo "APP_MASTER_SECRET normalized to 32-byte hex (sha256)"
              fi
            fi
          else
            echo "TEST_ENV is not set for this repository"
          fi

          # Non-secret KEY=value from the caller workflow.
          if [ -n "${PLAYWRIGHT_ENV:-}" ]; then
            export_dotenv "$PLAYWRIGHT_ENV" "playwright_env"
          fi

          if [ "${{ inputs.playwright_target }}" = "remote" ]; then
            export BASE_URL="${{ inputs.playwright_base_url }}"
            export PLAYWRIGHT_BASE_URL="${{ inputs.playwright_base_url }}"
            export E2E_BASE_URL="${{ inputs.playwright_base_url }}"
            export TEST_BASE_URL="${{ inputs.playwright_base_url }}"
            echo "Playwright target: $BASE_URL"
          fi

          if [ -n "${PLAYWRIGHT_PREPARE_COMMAND:-}" ]; then
            echo "Running playwright_prepare_command"
            printf '%s\n' "$PLAYWRIGHT_PREPARE_COMMAND" > "$RUNNER_TEMP/playwright-prepare.sh"
            sed -i -E \
              -e 's/^([[:space:]]*)set[[:space:]]+-euo[[:space:]]+pipefail[[:space:]]*$/\1set +e/' \
              -e 's/^([[:space:]]*)set[[:space:]]+-e[[:space:]]*$/\1set +e/' \
              "$RUNNER_TEMP/playwright-prepare.sh"
            # shellcheck disable=SC1090
            source "$RUNNER_TEMP/playwright-prepare.sh"
            prepare_status=$?
            if [ "$prepare_status" -ne 0 ]; then
              echo "playwright_prepare_command failed with status $prepare_status" >&2
              exit "$prepare_status"
            fi
          fi

          if [ "${{ inputs.playwright_start_mongodb }}" = "true" ]; then
            ci_mongo_name="ci-mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker rm -f "$ci_mongo_name" >/dev/null 2>&1 || true
            if [ "${{ inputs.playwright_mongodb_replica_set }}" = "true" ]; then
              docker run -d --name "$ci_mongo_name" -p "127.0.0.1::27017" \
                --memory=1g "${{ inputs.playwright_mongodb_image }}" --replSet rs0 --bind_ip_all
              ready=""
              for _ in $(seq 1 60); do
                if docker exec "$ci_mongo_name" mongosh --quiet --eval \
                  'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}) }; if (!db.hello().isWritablePrimary) { quit(1) }' \
                  >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [ -z "$ready" ]; then
                docker logs "$ci_mongo_name" || true
                echo "Playwright MongoDB replica set did not become primary" >&2
                exit 1
              fi
            else
              docker run -d --name "$ci_mongo_name" -p "127.0.0.1::27017" \
                "${{ inputs.playwright_mongodb_image }}"
              ready=""
              for _ in $(seq 1 30); do
                if docker exec "$ci_mongo_name" mongosh --quiet --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [ -z "$ready" ]; then
                docker logs "$ci_mongo_name" || true
                echo "Playwright MongoDB did not become ready" >&2
                exit 1
              fi
            fi
            mongo_port="$(docker port "$ci_mongo_name" 27017/tcp | cut -d: -f2)"
            db_name="${{ inputs.playwright_mongodb_db_name }}"
            if [ -n "$db_name" ]; then
              export MONGODB_DB_NAME="$db_name"
              export MONGODB_URI="mongodb://127.0.0.1:${mongo_port}/${db_name}?directConnection=true"
            else
              export MONGODB_URI="mongodb://127.0.0.1:${mongo_port}/?directConnection=true"
            fi
            export MONGO_TEST_URI="$MONGODB_URI"
            echo "Playwright MongoDB ready on port ${mongo_port}"
          fi

          if [ -n "${{ inputs.playwright_app_port }}" ] || [ -n "${PLAYWRIGHT_NEXT_COMMAND:-}" ]; then
            if [ -n "${{ inputs.playwright_app_port }}" ]; then
              export PLAYWRIGHT_APP_PORT="${{ inputs.playwright_app_port }}"
              if ! node -e "const net=require('net'); const s=net.createServer(); s.once('error',()=>process.exit(1)); s.listen(Number(process.env.PLAYWRIGHT_APP_PORT),'127.0.0.1',()=>s.close());"; then
                echo "Port ${PLAYWRIGHT_APP_PORT} is already in use" >&2
                exit 1
              fi
            else
              export PLAYWRIGHT_APP_PORT="$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')"
            fi
            export PORTAL_PORT="$PLAYWRIGHT_APP_PORT"
            export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:${PLAYWRIGHT_APP_PORT}}"
            export TEST_BASE_URL="${TEST_BASE_URL:-$NEXT_PUBLIC_APP_URL}"
            echo "Playwright app port: ${PLAYWRIGHT_APP_PORT}"
          fi

          if [ -n "${PLAYWRIGHT_NEXT_COMMAND:-}" ]; then
            echo "Starting playwright_next_command"
            next_log="$RUNNER_TEMP/playwright-next.log"
            bash -lc "$PLAYWRIGHT_NEXT_COMMAND" >"$next_log" 2>&1 &
            ci_next_pid=$!
            health_url="${{ inputs.playwright_health_url }}"
            health_url="$(eval echo "$health_url")"
            health_grep="${{ inputs.playwright_health_grep }}"
            ready=""
            for _ in $(seq 1 90); do
              if ! kill -0 "$ci_next_pid" 2>/dev/null; then
                cat "$next_log" || true
                echo "App server exited before it was ready" >&2
                exit 1
              fi
              if [ -n "$health_url" ]; then
                if [ -n "$health_grep" ]; then
                  body="$(curl -fsS "$health_url" 2>/dev/null || true)"
                  if printf '%s' "$body" | grep -q "$health_grep"; then
                    ready=1
                    break
                  fi
                else
                  code="$(curl -s -o /dev/null -w '%{http_code}' "$health_url" || true)"
                  if [ "$code" = "200" ]; then
                    ready=1
                    break
                  fi
                fi
              else
                ready=1
                break
              fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              cat "$next_log" || true
              echo "Timed out waiting for ${health_url:-app server}" >&2
              exit 1
            fi
            echo "App server is ready"
          fi

          if [ "${{ inputs.playwright_command != '' }}" = "true" ]; then
            printf '%s\n' "$PLAYWRIGHT_COMMAND" > "$RUNNER_TEMP/playwright-command.sh"
            sed -i -E \
              -e 's/^([[:space:]]*)set[[:space:]]+-euo[[:space:]]+pipefail[[:space:]]*$/\1set +e/' \
              -e 's/^([[:space:]]*)set[[:space:]]+-e[[:space:]]*$/\1set +e/' \
              "$RUNNER_TEMP/playwright-command.sh"
            (
              playwright_fail=0
              trap 'playwright_fail=1' ERR
              source "$RUNNER_TEMP/playwright-command.sh"
              source_status=$?
              trap - ERR
              if [ "$source_status" -ne 0 ]; then
                playwright_fail=1
              fi
              exit "$playwright_fail"
            )
            exit $?
          fi

          set +e

          echo "========================================"
          echo "Running Playwright E2E tests"
          echo "========================================"

          run_playwright() {

            case "${{ steps.package-manager.outputs.pm }}" in

              pnpm)
                pnpm exec playwright "$@"
                ;;

              yarn)
                yarn playwright "$@"
                ;;

              npm)
                npx --no-install playwright "$@"
                ;;

              *)
                echo "::error::Playwright requires a Node package manager in $APP_DIR."
                exit 1
                ;;

            esac

          }

          export RELATADB_REQUIRED=0

          if [ -n "${{ inputs.e2e_test_path }}" ]; then
            run_playwright \
              test \
              -c "${{ inputs.playwright_config }}" \
              "${{ inputs.e2e_test_path }}"
          else
            run_playwright \
              test \
              -c "${{ inputs.playwright_config }}"
          fi
          playwright_fail=$?

          if [ -n "${{ inputs.secondary_playwright_config }}" ]; then

            run_playwright \
              test \
              -c "${{ inputs.secondary_playwright_config }}"
            if [ "$?" -ne 0 ]; then
              playwright_fail=1
            fi

          fi

          exit "$playwright_fail"

      # ============================================================
      # UPLOAD PLAYWRIGHT REPORT
      # ============================================================

      - name: Upload Playwright report
        if: |
          always() &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            ${{ inputs.working_directory }}/playwright-report/
            ${{ inputs.working_directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # CLEAN UP MONGODB
      # ============================================================

      - name: Stop MongoDB
        if: |
          always() &&
          steps.detect-database.outputs.database == 'mongodb'
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CI_MONGO_NAME:-}" ]; then
            docker rm -f "$CI_MONGO_NAME" || true
          fi

      # ============================================================
      # FINAL QUALITY GATE
      # ============================================================

      - name: Quality Gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ steps.mode.outputs.mode }}"

          PLAYWRIGHT_RESULT="${{ steps.playwright-tests.outcome }}"
          NODE_UNIT_RESULT="${{ steps.node-unit-tests.outcome }}"
          PYTHON_UNIT_RESULT="${{ steps.python-unit-tests.outcome }}"
          CUSTOM_UNIT_RESULT="${{ steps.custom-unit-tests.outcome }}"
          UNIT_TEST_TYPE="${{ steps.unit-package-manager.outputs.type }}"

          PLAYWRIGHT_RESULT="${PLAYWRIGHT_RESULT:-not-run}"
          NODE_UNIT_RESULT="${NODE_UNIT_RESULT:-not-run}"
          PYTHON_UNIT_RESULT="${PYTHON_UNIT_RESULT:-not-run}"
          CUSTOM_UNIT_RESULT="${CUSTOM_UNIT_RESULT:-not-run}"
          UNIT_TEST_TYPE="${UNIT_TEST_TYPE:-not-detected}"

          # Compare the expression result only. Inserting unit_command itself
          # breaks this step when the command is multiline or contains quotes.
          if [ "${{ inputs.unit_command != '' }}" = "true" ]; then
            UNIT_TEST_TYPE="custom"
          fi

          echo "========================================"
          echo "Quality Gate Summary"
          echo "========================================"
          echo "Mode:               $MODE"
          echo "Playwright result:  $PLAYWRIGHT_RESULT"
          echo "Node unit result:   $NODE_UNIT_RESULT"
          echo "Python unit result: $PYTHON_UNIT_RESULT"
          echo "Unit test type:     $UNIT_TEST_TYPE"
          echo "========================================"

          summarize_log() {
            local file="$1"
            if [ ! -f "$file" ]; then
              echo "total=0 passed=0 failed=0 skipped=0 reported=no"
              return
            fi
            awk '
              function num(kind,    token, n) {
                token = $0
                n = 0
                if (match(token, "[0-9]+ " kind)) {
                  n = substr(token, RSTART, RLENGTH)
                  sub(/ .*/, "", n)
                }
                return n + 0
              }
              /Test Files/ { next }
              /[Tt]ests/ && /passed/ {
                seen = 1
                failed += num("failed")
                passed += num("passed")
                skipped += num("skipped")
                next
              }
              /^=+/ && /(failed|passed)/ {
                seen = 1
                failed += num("failed")
                passed += num("passed")
                skipped += num("skipped")
                next
              }
              /^[[:space:]]*[0-9]+ failed([[:space:]]|$)/ { seen = 1; failed += $1; next }
              /^[[:space:]]*[0-9]+ passed([[:space:]]|$)/ { seen = 1; passed += $1; next }
              /^[[:space:]]*[0-9]+ skipped([[:space:]]|$)/ { seen = 1; skipped += $1; next }
              /^# pass / { seen = 1; passed += $3; next }
              /^# fail / { seen = 1; failed += $3; next }
              /^# skipped / { seen = 1; skipped += $3; next }
              END {
                total = passed + failed + skipped
                if (!seen) print "total=0 passed=0 failed=0 skipped=0 reported=no"
                else printf "total=%d passed=%d failed=%d skipped=%d reported=yes\n", total, passed, failed, skipped
              }
            ' "$file"
          }

          echo "========================================"
          echo "Test counts"
          echo "========================================"
          UNIT_COUNTS="$(summarize_log "$RUNNER_TEMP/unit-tests.log")"
          PLAYWRIGHT_COUNTS="$(summarize_log "$RUNNER_TEMP/playwright-tests.log")"
          echo "Unit cases:         $UNIT_COUNTS"
          echo "Playwright cases:   $PLAYWRIGHT_COUNTS"

          failed_files() {
            local file="$1"
            if [ ! -f "$file" ]; then
              echo "(none)"
              return
            fi
            awk '
              function remember(path) {
                gsub(/\033\[[0-9;]*[A-Za-z]/, "", path)
                sub(/.*\/_work\/[^\/]+\/[^\/]+\//, "", path)
                sub(/:[0-9]+:[0-9]+$/, "", path)
                sub(/:[0-9]+$/, "", path)
                sub(/::.*$/, "", path)
                if (path ~ /\.(spec|test)\.[cm]?[jt]sx?$/ || path ~ /\.py$/) files[path] = 1
              }
              {
                line = $0
                gsub(/\033\[[0-9;]*[A-Za-z]/, "", line)
                loc = index(line, "location:")
                if (loc > 0) {
                  token = substr(line, loc + 9)
                  sub(/^[[:space:]]+/, "", token)
                  if (substr(token, 1, 1) == "\047") token = substr(token, 2)
                  sub(/\047.*$/, "", token)
                  sub(/[[:space:]].*$/, "", token)
                  remember(token)
                }
                err = index(line, "::error file=")
                if (err > 0) {
                  token = substr(line, err + 13)
                  sub(/,.*/, "", token)
                  remember(token)
                }
                if (line ~ /(^|[[:space:]])(FAIL|FAILED)([[:space:]]|$)/ || line ~ /^[[:space:]]*[0-9]+\)/) {
                  if (match(line, /[^[:space:]›]+(\.spec|\.test)\.[cm]?[jt]sx?/)) remember(substr(line, RSTART, RLENGTH))
                  if (match(line, /[^[:space:]]+\.py/)) remember(substr(line, RSTART, RLENGTH))
                }
              }
              END {
                n = 0
                for (f in files) n++
                if (n == 0) print "(none)"
                else for (f in files) print f
              }
            ' "$file" | sort -u
          }

          echo "Failed unit files:"
          failed_files "$RUNNER_TEMP/unit-tests.log" | head -40
          echo "Failed Playwright files:"
          failed_files "$RUNNER_TEMP/playwright-tests.log" | head -40
          echo "========================================"

          case "$MODE" in

            playwright)

              if [ "${{ steps.playwright-config.outputs.present }}" = "true" ] &&
                 [ "$PLAYWRIGHT_RESULT" != "success" ]; then
                echo "::error::Playwright quality gate failed."
                exit 1
              fi

              ;;

            unit)

              case "$UNIT_TEST_TYPE" in

                node)

                  if [ "$NODE_UNIT_RESULT" != "success" ]; then
                    echo "::error::Node unit test quality gate failed."
                    exit 1
                  fi

                  ;;

                python)

                  if [ "$PYTHON_UNIT_RESULT" != "success" ]; then
                    echo "::error::Python unit test quality gate failed."
                    exit 1
                  fi

                  ;;

                custom)

                  if [ "$CUSTOM_UNIT_RESULT" != "success" ]; then
                    echo "::error::Custom unit command quality gate failed."
                    exit 1
                  fi

                  ;;

                *)

                  echo "::error::No valid unit-test runner was detected."
                  exit 1

                  ;;

              esac

              ;;

            both)

              GATE_FAILED=false

              if [ "${{ steps.playwright-config.outputs.present }}" = "true" ] &&
                 [ "$PLAYWRIGHT_RESULT" != "success" ]; then
                echo "::error::Playwright quality gate failed."
                GATE_FAILED=true
              fi

              case "$UNIT_TEST_TYPE" in

                node)

                  if [ "$NODE_UNIT_RESULT" != "success" ]; then
                    echo "::error::Node unit test quality gate failed."
                    GATE_FAILED=true
                  fi

                  ;;

                python)

                  if [ "$PYTHON_UNIT_RESULT" != "success" ]; then
                    echo "::error::Python unit test quality gate failed."
                    GATE_FAILED=true
                  fi

                  ;;

                custom)

                  if [ "$CUSTOM_UNIT_RESULT" != "success" ]; then
                    echo "::error::Custom unit command quality gate failed."
                    GATE_FAILED=true
                  fi

                  ;;

                *)

                  echo "::error::No valid unit-test runner was detected."
                  GATE_FAILED=true

                  ;;

              esac

              if [ "$GATE_FAILED" = "true" ]; then
                exit 1
              fi

              ;;

            *)

              echo "::error::Unknown quality gate mode: $MODE"
              exit 1

              ;;

          esac

          echo "========================================"
          echo "Quality Gate PASSED"
          echo "========================================"
