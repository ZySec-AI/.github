name: Reusable Tests

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        required: false
        default: '["self-hosted","linux","x64","zysec-ai-ci"]'

      test_mode:
        description: "Tests to run: unit, playwright, or both"
        required: true
        type: string

      unit_test_path:
        description: "Path to unit tests"
        required: false
        default: "tests/unit"
        type: string

      e2e_test_path:
        description: "Path to Playwright E2E tests"
        required: false
        default: "tests/e2e"
        type: string

      playwright_config:
        description: "Playwright configuration file"
        required: false
        default: "playwright.config.ts"
        type: string

      node_version:
        description: "Node.js version"
        required: false
        default: "20"
        type: string

      python_version:
        description: "Python version"
        required: false
        default: "3.12"
        type: string

      playwright_browser:
        description: "Playwright browser"
        required: false
        default: "chromium"
        type: string

      install_playwright_deps:
        description: "Install Playwright OS dependencies"
        required: false
        default: true
        type: boolean

    secrets:
      ORG_ADMIN_TOKEN:
        description: "Token used for private Git dependencies"
        required: false

jobs:
  quality-gates:
    name: Quality Gates

    runs-on: ${{ fromJSON(inputs.runs_on) }}

    timeout-minutes: 45

    env:
      # ============================================================
      # RELATABD
      #
      # IMPORTANT:
      #
      # RELATA_BEARER_TOKEN is the RelataDB bootstrap token.
      # It is NOT the token used by the application for /query
      # or /ingest.
      #
      # RELATADB_TOKEN will be populated later with a tenant-scoped
      # token minted from /admin/tokens.
      # ============================================================

      RELATADB_URL: http://localhost:9090
      RELATA_BEARER_TOKEN: threatmap-bootstrap
      RELATA_ADMIN_TOKEN: threatmap-admin

      RELATADB_REQUIRED: "1"

      # Tenant used by the E2E application.
      RELATADB_ORG_ID: threatmap

      # Unique Compose project for this GitHub Actions run.
      COMPOSE_PROJECT_NAME: threatmap-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VALIDATE TEST MODE
      # ============================================================

      - name: Validate test mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.test_mode }}"

          case "$MODE" in
            unit|playwright|both)
              ;;
            *)
              echo "::error::Invalid test mode: $MODE"
              echo "::error::Expected: unit, playwright, or both."
              exit 1
              ;;
          esac

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Test Configuration"
          echo "========================================"
          echo "Mode:               $MODE"
          echo "Unit test path:     ${{ inputs.unit_test_path }}"
          echo "E2E test path:      ${{ inputs.e2e_test_path }}"
          echo "Playwright config:  ${{ inputs.playwright_config }}"
          echo "Node version:       ${{ inputs.node_version }}"
          echo "Python version:     ${{ inputs.python_version }}"
          echo "Playwright browser: ${{ inputs.playwright_browser }}"
          echo "RelataDB URL:       $RELATADB_URL"
          echo "RelataDB org:       $RELATADB_ORG_ID"
          echo "Compose project:    $COMPOSE_PROJECT_NAME"
          echo "========================================"

      # ============================================================
      # DETECT ROOT NODE PACKAGE MANAGER
      # ============================================================

      - name: Detect root Node package manager
        id: package-manager
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pnpm-lock.yaml ]; then
            PM="pnpm"
          elif [ -f yarn.lock ]; then
            PM="yarn"
          elif [ -f package-lock.json ]; then
            PM="npm"
          elif [ -f package.json ]; then
            echo "::error::package.json exists but no lockfile was found."
            exit 1
          else
            echo "::error::No supported Node package configuration found."
            exit 1
          fi

          echo "pm=$PM" >> "$GITHUB_OUTPUT"

          echo "Detected root package manager: $PM"

      # ============================================================
      # SETUP NODE
      # ============================================================

      - name: Setup Node.js
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # ============================================================
      # ENABLE COREPACK
      # ============================================================

      - name: Enable Corepack
        if: |
          steps.package-manager.outputs.pm == 'pnpm' ||
          steps.package-manager.outputs.pm == 'yarn'
        shell: bash
        run: |
          set -euo pipefail

          corepack enable

      # ============================================================
      # DETECT ROOT PNPM VERSION
      # ============================================================

      - name: Detect root pnpm version
        if: steps.package-manager.outputs.pm == 'pnpm'
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            node -pe '
              const pkg = require("./package.json");
              const value = pkg.packageManager || "";
              value.startsWith("pnpm@") ? value.substring(5) : "";
            '
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::package.json must declare a pnpm version."
            echo "::error::Example: \"packageManager\": \"pnpm@9.15.0\""
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP ROOT PNPM
      # ============================================================

      - name: Setup root pnpm
        if: steps.package-manager.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # ============================================================
      # CHECK UNIT TEST DIRECTORY
      # ============================================================

      - name: Check unit test directory
        id: check-unit-tests
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          UNIT_PATH="${{ inputs.unit_test_path }}"

          if [ ! -d "$UNIT_PATH" ]; then
            echo "::error::Required unit test directory '$UNIT_PATH' does not exist."
            exit 1
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DETECT UNIT TEST TYPE / PACKAGE MANAGER
      # ============================================================

      - name: Detect unit-test package manager
        id: unit-package-manager
        if: |
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          ) &&
          steps.check-unit-tests.outputs.present == 'true'
        shell: bash
        env:
          UNIT_PATH: ${{ inputs.unit_test_path }}
          ROOT_PM: ${{ steps.package-manager.outputs.pm }}
        run: |
          set -euo pipefail

          ROOT_DIR="${GITHUB_WORKSPACE:-$PWD}"

          detect_node_pm() {
            local DIR="$1"

            if [ -f "$DIR/pnpm-lock.yaml" ]; then
              echo "pnpm"
            elif [ -f "$DIR/yarn.lock" ]; then
              echo "yarn"
            elif [ -f "$DIR/package-lock.json" ]; then
              echo "npm"
            else
              echo ""
            fi
          }

          if [ -f "$UNIT_PATH/package.json" ]; then

            PM="$(detect_node_pm "$UNIT_PATH")"

            if [ -z "$PM" ]; then
              echo "::error::Node unit-test project found at '$UNIT_PATH', but no lockfile was found."
              exit 1
            fi

            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "pm=$PM" >> "$GITHUB_OUTPUT"
            echo "location=nested" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          if [ -f "$UNIT_PATH/pytest.ini" ] || \
             [ -f "$UNIT_PATH/pyproject.toml" ] || \
             [ -f "$UNIT_PATH/requirements.txt" ]; then

            echo "type=python" >> "$GITHUB_OUTPUT"
            echo "pm=python" >> "$GITHUB_OUTPUT"
            echo "location=nested" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          if [ -f "$ROOT_DIR/package.json" ]; then

            PM="${ROOT_PM:-}"

            if [ -z "$PM" ]; then
              PM="$(detect_node_pm "$ROOT_DIR")"
            fi

            if [ -z "$PM" ]; then
              echo "::error::Root package.json exists but no lockfile was found."
              exit 1
            fi

            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "pm=$PM" >> "$GITHUB_OUTPUT"
            echo "location=root" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          if [ -f "$ROOT_DIR/pytest.ini" ] || \
             [ -f "$ROOT_DIR/pyproject.toml" ] || \
             [ -f "$ROOT_DIR/requirements.txt" ]; then

            echo "type=python" >> "$GITHUB_OUTPUT"
            echo "pm=python" >> "$GITHUB_OUTPUT"
            echo "location=root" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "::error::Unable to detect unit-test runner."
          exit 1

      # ============================================================
      # DETECT UNIT PNPM VERSION
      # ============================================================

      - name: Detect unit-test pnpm version
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'pnpm' &&
          steps.unit-package-manager.outputs.location == 'nested'
        id: unit-pnpm-version
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ inputs.unit_test_path }}"

          VERSION="$(
            node -pe '
              const pkg = require("./package.json");
              const value = pkg.packageManager || "";
              value.startsWith("pnpm@") ? value.substring(5) : "";
            '
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::Unit-test package.json must declare its pnpm version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP UNIT PNPM
      # ============================================================

      - name: Setup unit-test pnpm
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'pnpm' &&
          steps.unit-package-manager.outputs.location == 'nested'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.unit-pnpm-version.outputs.version }}

      # ============================================================
      # ENABLE UNIT YARN
      # ============================================================

      - name: Enable unit-test Yarn
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'yarn' &&
          steps.unit-package-manager.outputs.location == 'nested'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable

      # ============================================================
      # DETECT PYTHON UNIT TESTS
      # ============================================================

      - name: Detect Python unit tests
        id: python-tests
        if: steps.unit-package-manager.outputs.type == 'python'
        shell: bash
        run: |
          set -euo pipefail

          echo "present=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        if: steps.python-tests.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # ============================================================
      # INSTALL ROOT NODE DEPENDENCIES
      # ============================================================

      - name: Install root Node dependencies
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail

          case "${{ steps.package-manager.outputs.pm }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --immutable
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "::error::Unsupported package manager."
              exit 1
              ;;
          esac

      # ============================================================
      # INSTALL PYTHON UNIT-TEST DEPENDENCIES
      # ============================================================

      - name: Install Python unit-test dependencies
        if: steps.python-tests.outputs.present == 'true'
        shell: bash
        env:
          UNIT_PATH: ${{ inputs.unit_test_path }}
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_PATH"
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          elif [ -f pytest.ini ]; then
            python -m pip install pytest
          else
            echo "::error::No supported Python dependency configuration found."
            exit 1
          fi

      # ============================================================
      # INSTALL NODE UNIT-TEST DEPENDENCIES
      # ============================================================

      - name: Install Node unit-test dependencies
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.location == 'nested'
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ inputs.unit_test_path }}"

          case "${{ steps.unit-package-manager.outputs.pm }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --immutable
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "::error::Unsupported unit-test package manager."
              exit 1
              ;;
          esac

      # ============================================================
      # VERIFY PLAYWRIGHT CONFIGURATION
      # ============================================================

      - name: Verify Playwright configuration
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${{ inputs.playwright_config }}"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Playwright configuration '$CONFIG' does not exist."
            exit 1
          fi

      # ============================================================
      # VERIFY E2E TEST DIRECTORY
      # ============================================================

      - name: Verify E2E test directory
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          E2E_PATH="${{ inputs.e2e_test_path }}"

          if [ ! -d "$E2E_PATH" ]; then
            echo "::error::Playwright test directory '$E2E_PATH' does not exist."
            exit 1
          fi

      # ============================================================
      # VERIFY DOCKER
      # ============================================================

      - name: Verify Docker
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          command -v docker >/dev/null 2>&1 || {
            echo "::error::Docker is not available."
            exit 1
          }

          docker --version
          docker compose version

      # ============================================================
      # START RELATABD
      #
      # RELATA_BEARER_TOKEN:
      #   bootstrap credential
      #
      # RELATA_ADMIN_TOKEN:
      #   admin credential used to mint tenant token
      # ============================================================

      - name: Start RelataDB
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        env:
          RELATA_BEARER_TOKEN: threatmap-bootstrap
          RELATA_ADMIN_TOKEN: threatmap-admin
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Starting RelataDB"
          echo "========================================"

          docker compose down -v --remove-orphans || true

          # These variables are deliberately exported because the
          # docker-compose.yml is expected to reference them as:
          #
          #   RELATA_BEARER_TOKEN
          #   RELATA_ADMIN_TOKEN
          #
          export RELATA_BEARER_TOKEN
          export RELATA_ADMIN_TOKEN

          docker compose up -d --force-recreate relatadb

          echo "========================================"
          echo "Compose status"
          echo "========================================"

          docker compose ps

          CONTAINER_ID="$(docker compose ps -q relatadb)"

          if [ -z "$CONTAINER_ID" ]; then
            echo "::error::RelataDB container was not created."
            exit 1
          fi

          echo "========================================"
          echo "RelataDB authentication configuration"
          echo "========================================"

          docker inspect "$CONTAINER_ID" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -E '^RELATA_(BEARER_TOKEN|ADMIN_TOKEN)=' \
            | sed 's/=.*$/=<redacted>/'

      # ============================================================
      # WAIT FOR RELATABD
      # ============================================================

      - name: Wait for RelataDB
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Waiting for RelataDB"
          echo "========================================"

          for i in {1..60}; do

            if curl -fsS "$RELATADB_URL/health" >/dev/null 2>&1; then
              echo "RelataDB is healthy."
              curl -fsS "$RELATADB_URL/health"
              echo
              exit 0
            fi

            echo "RelataDB not ready yet ($i/60)..."

            if [ "$i" -eq 10 ] || [ "$i" -eq 20 ] || [ "$i" -eq 40 ]; then
              docker compose ps || true
              docker compose logs --no-color --tail=50 relatadb || true
            fi

            sleep 2
          done

          echo "::error::RelataDB did not become healthy within 120 seconds."

          docker compose ps || true
          docker compose logs --no-color --tail=200 relatadb || true

          exit 1

      # ============================================================
      # MINT TENANT-SCOPED RELATABD TOKEN
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # RELATA_BEARER_TOKEN is NOT valid for /query or /ingest.
      #
      # We mint a real tenant token using RELATA_ADMIN_TOKEN.
      #
      # The admin listener is loopback-only, so the request is made
      # from inside the RelataDB container.
      # ============================================================

      - name: Mint RelataDB tenant token
        shell: bash
        env:
          RELATADB_URL: http://localhost:9090
          RELATADB_TOKEN: threatmap-default
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Minting RelataDB tenant token"
          echo "========================================"

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl \
              -sS \
              -o "$RESPONSE_FILE" \
              -w "%{http_code}" \
              -X POST \
              "$RELATADB_URL/<YOUR_EXISTING_TOKEN_ENDPOINT>" \
              -H "Authorization: Bearer $RELATADB_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{
                "tenant_id": "threatmap"
              }"
          )"

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat "$RESPONSE_FILE"
          echo

          rm -f "$RESPONSE_FILE"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::RelataDB tenant-token minting failed with HTTP $HTTP_STATUS"
            exit 1
          fi


      # ============================================================
      # VERIFY RELATABD AUTHENTICATION
      #
      # Use the MINTED TENANT TOKEN.
      #
      # DO NOT use RELATA_BEARER_TOKEN here.
      # ============================================================

      - name: Verify RelataDB authentication
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying RelataDB tenant authentication"
          echo "========================================"

          if [ -z "${RELATADB_TOKEN:-}" ]; then
            echo "::error::RELATADB_TOKEN was not created."
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl \
              -sS \
              -o "$RESPONSE_FILE" \
              -w "%{http_code}" \
              -X POST \
              "$RELATADB_URL/query" \
              -H "Authorization: Bearer $RELATADB_TOKEN" \
              -H "X-Organization-Id: $RELATADB_ORG_ID" \
              -H "Content-Type: application/json" \
              --data '{"sql":"SELECT 1"}'
          )"

          echo "RelataDB query HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::RelataDB tenant authentication failed."
            echo "::error::HTTP status: $HTTP_STATUS"
            echo "::error::Response:"
            cat "$RESPONSE_FILE"
            echo

            echo "========================================"
            echo "RelataDB status"
            echo "========================================"

            docker compose ps || true

            echo "========================================"
            echo "RelataDB logs"
            echo "========================================"

            docker compose logs --no-color --tail=200 relatadb || true

            rm -f "$RESPONSE_FILE"

            exit 1
          fi

          echo "RelataDB tenant authentication succeeded."

          cat "$RESPONSE_FILE"
          echo

          rm -f "$RESPONSE_FILE"

      # ============================================================
      # INSTALL PLAYWRIGHT OS DEPENDENCIES
      # ============================================================

      - name: Install Playwright OS dependencies
        if: |
          inputs.install_playwright_deps == true &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          . /etc/os-release

          case "$VERSION_ID" in
            24.04)
              packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
                fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont \
                fonts-wqy-zenhei libasound2t64 libatk-bridge2.0-0t64 \
                libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 \
                libdbus-1-3 libdrm2 libfontconfig1 libfreetype6 libgbm1 \
                libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 \
                libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 xfonts-cyrillic \
                xfonts-scalable xvfb"
              ;;
            22.04)
              packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
                fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont \
                fonts-wqy-zenhei libasound2 libatk-bridge2.0-0 \
                libatk1.0-0 libatspi2.0-0 libcairo2 libcups2 libdbus-1-3 \
                libdrm2 libfontconfig1 libfreetype6 libgbm1 libglib2.0-0 \
                libnspr4 libnss3 libpango-1.0-0 libwayland-client0 \
                libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 xfonts-cyrillic \
                xfonts-scalable xvfb"
              ;;
            *)
              echo "::error::Unsupported runner OS: $PRETTY_NAME"
              exit 1
              ;;
          esac

          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq

          sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
            --no-install-recommends \
            $packages

      # ============================================================
      # INSTALL PLAYWRIGHT BROWSER
      # ============================================================

      - name: Install Playwright browser
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          npx playwright install "${{ inputs.playwright_browser }}"

      # ============================================================
      # RUN PLAYWRIGHT
      #
      # RELATADB_TOKEN is now the minted tenant token.
      # ============================================================

      - name: Run Playwright E2E tests
        id: playwright-tests
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        env:
          RELATADB_URL: http://localhost:9090
          RELATADB_TOKEN: ${{ env.RELATADB_TOKEN }}
          RELATADB_REQUIRED: "1"
          RELATADB_ORG_ID: threatmap
          E2E_PROVISION_LOCAL_ADMIN: "1"
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Running Playwright E2E tests"
          echo "========================================"

          echo "RelataDB URL: $RELATADB_URL"
          echo "RelataDB organization: $RELATADB_ORG_ID"
          echo "RelataDB token: configured"
          echo "RelataDB required: $RELATADB_REQUIRED"
          echo "E2E provisioning: $E2E_PROVISION_LOCAL_ADMIN"

          echo "Checking RelataDB health..."

          curl -fsS "$RELATADB_URL/health"

          echo

          echo "Starting Playwright..."

          npx playwright test \
            -c "${{ inputs.playwright_config }}" \
            "${{ inputs.e2e_test_path }}"

      # ============================================================
      # UPLOAD PLAYWRIGHT REPORT
      # ============================================================

      - name: Upload Playwright report
        if: |
          always() &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # SHOW RELATABD LOGS ON FAILURE
      # ============================================================

      - name: Show RelataDB logs on failure
        if: |
          failure() &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RelataDB container status"
          echo "========================================"

          docker compose ps || true

          echo "========================================"
          echo "RelataDB logs"
          echo "========================================"

          docker compose logs --no-color --tail=300 relatadb || true

      # ============================================================
      # RUN NODE UNIT TESTS
      # ============================================================

      - name: Run Node unit tests
        id: node-unit-tests
        if: |
          always() &&
          steps.unit-package-manager.outputs.type == 'node'
        shell: bash
        env:
          UNIT_PATH: ${{ inputs.unit_test_path }}
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_PATH"
          fi

          case "${{ steps.unit-package-manager.outputs.pm }}" in
            pnpm)
              pnpm test
              ;;
            yarn)
              yarn test
              ;;
            npm)
              npm test
              ;;
            *)
              echo "::error::Unsupported unit-test package manager."
              exit 1
              ;;
          esac

      # ============================================================
      # RUN PYTHON UNIT TESTS
      # ============================================================

      - name: Run Python unit tests
        id: python-unit-tests
        if: |
          always() &&
          steps.unit-package-manager.outputs.type == 'python'
        shell: bash
        env:
          UNIT_PATH: ${{ inputs.unit_test_path }}
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_PATH"
            python -m pytest .
          else
            python -m pytest "$UNIT_PATH"
          fi

      # ============================================================
      # CLEAN UP RELATABD
      # ============================================================

      - name: Stop RelataDB
        if: |
          always() &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Stopping RelataDB"
          echo "========================================"

          docker compose down -v --remove-orphans || true

          echo "RelataDB cleanup completed."

      # ============================================================
      # FINAL QUALITY GATE
      # ============================================================

      - name: Quality Gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ steps.mode.outputs.mode }}"

          PLAYWRIGHT_RESULT="${{ steps.playwright-tests.outcome }}"
          NODE_UNIT_RESULT="${{ steps.node-unit-tests.outcome }}"
          PYTHON_UNIT_RESULT="${{ steps.python-unit-tests.outcome }}"
          UNIT_TEST_TYPE="${{ steps.unit-package-manager.outputs.type }}"

          PLAYWRIGHT_RESULT="${PLAYWRIGHT_RESULT:-not-run}"
          NODE_UNIT_RESULT="${NODE_UNIT_RESULT:-not-run}"
          PYTHON_UNIT_RESULT="${PYTHON_UNIT_RESULT:-not-run}"
          UNIT_TEST_TYPE="${UNIT_TEST_TYPE:-not-detected}"

          echo "========================================"
          echo "Quality Gate Summary"
          echo "========================================"
          echo "Mode:               $MODE"
          echo "Playwright result:  $PLAYWRIGHT_RESULT"
          echo "Node unit result:   $NODE_UNIT_RESULT"
          echo "Python unit result: $PYTHON_UNIT_RESULT"
          echo "Unit test type:     $UNIT_TEST_TYPE"
          echo "========================================"

          case "$MODE" in

            playwright)

              if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
                echo "::error::Playwright quality gate failed."
                exit 1
              fi
              ;;

            unit)

              case "$UNIT_TEST_TYPE" in

                node)
                  if [ "$NODE_UNIT_RESULT" != "success" ]; then
                    echo "::error::Node unit test quality gate failed."
                    exit 1
                  fi
                  ;;

                python)
                  if [ "$PYTHON_UNIT_RESULT" != "success" ]; then
                    echo "::error::Python unit test quality gate failed."
                    exit 1
                  fi
                  ;;

                *)
                  echo "::error::No valid unit-test runner was detected."
                  exit 1
                  ;;

              esac
              ;;

            both)

              GATE_FAILED=false

              if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
                echo "::error::Playwright quality gate failed."
                GATE_FAILED=true
              fi

              case "$UNIT_TEST_TYPE" in

                node)
                  if [ "$NODE_UNIT_RESULT" != "success" ]; then
                    echo "::error::Node unit test quality gate failed."
                    GATE_FAILED=true
                  fi
                  ;;

                python)
                  if [ "$PYTHON_UNIT_RESULT" != "success" ]; then
                    echo "::error::Python unit test quality gate failed."
                    GATE_FAILED=true
                  fi
                  ;;

                *)
                  echo "::error::No valid unit-test runner was detected."
                  GATE_FAILED=true
                  ;;

              esac

              if [ "$GATE_FAILED" = "true" ]; then
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown quality gate mode: $MODE"
              exit 1
              ;;

          esac

          echo "========================================"
          echo "Quality Gate PASSED"
          echo "========================================"
