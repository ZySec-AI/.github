name: Reusable Tests

on:
  workflow_call:

    # ============================================================
    # INPUTS
    # ============================================================

    inputs:

      runs_on:
        description: "JSON array of GitHub Actions runner labels"
        required: false
        type: string
        default: '["self-hosted","linux","x64","zysec-ai-ci"]'

      test_mode:
        description: "Tests to run: unit, playwright, or both"
        required: true
        type: string

      unit_test_path:
        description: "Path to unit tests"
        required: false
        type: string
        default: "tests/unit"

      e2e_test_path:
        description: "Path to Playwright E2E tests"
        required: false
        type: string
        default: "tests/e2e"

      playwright_config:
        description: "Playwright configuration file"
        required: false
        type: string
        default: "playwright.config.ts"

      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"

      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"

      playwright_browser:
        description: "Playwright browser"
        required: false
        type: string
        default: "chromium"

      install_playwright_deps:
        description: "Install Playwright OS dependencies"
        required: false
        type: boolean
        default: true

      working_directory:
        description: "Application directory"
        required: false
        type: string
        default: "."

      database:
        description: "Database mode: auto, relatadb, mongodb, or none"
        required: false
        type: string
        default: "auto"

      unit_command:
        description: "Custom unit-test command"
        required: false
        type: string
        default: ""

      secondary_playwright_config:
        description: "Optional second Playwright configuration"
        required: false
        type: string
        default: ""

      node_required:
        description: "Fail when no Node project and no Python project is detected"
        required: false
        type: boolean
        default: true

    # ============================================================
    # SECRETS
    # ============================================================

    secrets:

      ORG_ADMIN_TOKEN:
        description: "Token used for private Git dependencies"
        required: false

# ==================================================================
# JOB
# ==================================================================

jobs:

  quality-gates:

    name: Quality Gates

    runs-on: ${{ fromJSON(inputs.runs_on) }}

    timeout-minutes: 45

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VALIDATE TEST MODE
      # ============================================================

      - name: Validate test mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.test_mode }}"

          case "$MODE" in
            unit|playwright|both)
              ;;
            *)
              echo "::error::Invalid test mode: $MODE"
              echo "::error::Expected: unit, playwright, or both."
              exit 1
              ;;
          esac

          case "${{ inputs.database }}" in
            auto|relatadb|mongodb|none)
              ;;
            *)
              echo "::error::Invalid database: ${{ inputs.database }}"
              echo "::error::Expected: auto, relatadb, mongodb, or none."
              exit 1
              ;;
          esac

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Test Configuration"
          echo "========================================"
          echo "Mode:               $MODE"
          echo "Unit test path:     ${{ inputs.unit_test_path }}"
          echo "E2E test path:      ${{ inputs.e2e_test_path }}"
          echo "Playwright config:  ${{ inputs.playwright_config }}"
          echo "Node version:       ${{ inputs.node_version }}"
          echo "Python version:     ${{ inputs.python_version }}"
          echo "Playwright browser: ${{ inputs.playwright_browser }}"
          echo "Working directory:  ${{ inputs.working_directory }}"
          echo "Database input:     ${{ inputs.database }}"
          echo "========================================"

      # ============================================================
      # RESOLVE APP PATHS
      # ============================================================

      - name: Resolve app paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${{ inputs.working_directory }}"
          APP_DIR="${APP_DIR%/}"

          if [ -z "$APP_DIR" ]; then
            APP_DIR="."
          fi

          UNIT_DIR="$APP_DIR/${{ inputs.unit_test_path }}"
          E2E_DIR="$APP_DIR/${{ inputs.e2e_test_path }}"

          {
            echo "APP_DIR=$APP_DIR"
            echo "UNIT_DIR=$UNIT_DIR"
            echo "E2E_DIR=$E2E_DIR"
          } >> "$GITHUB_ENV"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "App directory: $APP_DIR"
          echo "Unit directory: $UNIT_DIR"
          echo "E2E directory: $E2E_DIR"

      # ============================================================
      # DETECT APPLICATION DATABASE
      # ============================================================

      - name: Detect application database
        id: detect-database
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ inputs.database }}"

          if [ "$REQUESTED" != "auto" ]; then
            echo "database=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "Database forced by caller: $REQUESTED"
            exit 0
          fi

          found_relata=0
          found_mongo=0
          found_falkor=0
          found_minio=0
          found_clickhouse=0

          while IFS= read -r file; do

            [ -f "$file" ] || continue

            if grep -Eiq 'relata-db|relatadb|RELATADB_' "$file"; then
              found_relata=1
            fi

            if grep -Eiq 'mongodb|image:[[:space:]]*mongo' "$file"; then
              found_mongo=1
            fi

            if grep -Eiq 'falkordb|falkor' "$file"; then
              found_falkor=1
            fi

            if grep -Eiq 'minio' "$file"; then
              found_minio=1
            fi

            if grep -Eiq 'clickhouse' "$file"; then
              found_clickhouse=1
            fi

          done < <(
            find "$APP_DIR" -type f \
              \( \
                -name 'docker-compose*.yml' \
                -o -name 'docker-compose*.yaml' \
                -o -name 'compose.yml' \
                -o -name 'compose.yaml' \
              \) \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*'
          )

          noted=""

          [ "$found_falkor" -eq 1 ] && noted="${noted} falkordb"
          [ "$found_minio" -eq 1 ] && noted="${noted} minio"
          [ "$found_clickhouse" -eq 1 ] && noted="${noted} clickhouse"

          noted="${noted# }"

          echo "noted=$noted" >> "$GITHUB_OUTPUT"

          if [ -n "$noted" ]; then
            echo "Recognized supporting services with no test block yet: $noted"
          fi

          if [ "$found_relata" -eq 1 ] && [ "$found_mongo" -eq 1 ]; then
            echo "::error::Both RelataDB and MongoDB are declared."
            echo "::error::Set the database input to choose one."
            exit 1
          fi

          if [ "$found_relata" -eq 1 ]; then
            selected="relatadb"
          elif [ "$found_mongo" -eq 1 ]; then
            selected="mongodb"
          else
            selected="none"
          fi

          echo "database=$selected" >> "$GITHUB_OUTPUT"

          echo "Detected application database: $selected"

      # ============================================================
      # CONFIGURE DATABASE
      # ============================================================

      - name: Configure selected database
        shell: bash
        run: |
          set -euo pipefail

          case "${{ steps.detect-database.outputs.database }}" in

            relatadb)

              {
                echo "RELATADB_URL=http://localhost:9090"
                echo "RELATADB_TOKEN=threatmap-default"
                echo "RELATADB_ORG_ID=threatmap"
                echo "COMPOSE_PROJECT_NAME=threatmap-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              } >> "$GITHUB_ENV"

              echo "RelataDB environment configured."

              ;;

            mongodb|none)

              echo "RELATADB_REQUIRED=0" >> "$GITHUB_ENV"

              echo "RelataDB is not required for ${{ steps.detect-database.outputs.database }}."

              ;;

          esac

      # ============================================================
      # DETECT ROOT NODE PACKAGE MANAGER
      # ============================================================

      - name: Detect root Node package manager
        id: package-manager
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          APP="$APP_DIR"

          is_python_dir() {
            [ -f "$1/pyproject.toml" ] ||
            [ -f "$1/pytest.ini" ] ||
            [ -f "$1/requirements.txt" ]
          }

          if [ -f "$APP/pnpm-lock.yaml" ]; then

            # A Python app can keep a stub package.json for the org quality
            # gate. uv.lock plus pyproject.toml is the test project when that
            # manifest does not declare a package manager.
            if [ -f "$APP/uv.lock" ] && [ -f "$APP/pyproject.toml" ] &&
               { [ ! -f "$APP/package.json" ] || ! grep -q '"packageManager"' "$APP/package.json"; }; then
              PM="none"
            else
              PM="pnpm"
            fi

          elif [ -f "$APP/yarn.lock" ]; then

            PM="yarn"

          elif [ -f "$APP/package-lock.json" ]; then

            PM="npm"

          elif [ -f "$APP/package.json" ]; then

            echo "::error::package.json exists but no lockfile was found in $APP."
            exit 1

          elif is_python_dir "$APP" || is_python_dir "$UNIT_DIR"; then

            PM="none"

          elif [ "${{ inputs.node_required }}" = "true" ]; then

            echo "::error::No supported Node package configuration found in $APP."
            exit 1

          else

            PM="none"

          fi

          echo "pm=$PM" >> "$GITHUB_OUTPUT"

          echo "Detected root package manager: $PM"

      # ============================================================
      # SETUP NODE
      # ============================================================

      - name: Setup Node.js
        if: |
          steps.package-manager.outputs.pm != 'none' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # ============================================================
      # ENABLE COREPACK
      # ============================================================

      - name: Enable Corepack
        if: |
          steps.package-manager.outputs.pm == 'pnpm' ||
          steps.package-manager.outputs.pm == 'yarn'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable

      # ============================================================
      # DETECT ROOT PNPM VERSION
      # ============================================================

      - name: Detect root pnpm version
        if: steps.package-manager.outputs.pm == 'pnpm'
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ inputs.working_directory }}"

          VERSION="$(
            node -pe '
              const pkg = require("./package.json");
              const value = pkg.packageManager || "";
              value.startsWith("pnpm@") ? value.substring(5) : "";
            '
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::package.json must declare a pnpm version."
            echo "::error::Example: \"packageManager\": \"pnpm@9.15.0\""
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP ROOT PNPM
      # ============================================================

      - name: Setup root pnpm
        if: steps.package-manager.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # ============================================================
      # CHECK UNIT TEST DIRECTORY
      # ============================================================

      - name: Check unit test directory
        id: check-unit-tests
        if: |
          steps.mode.outputs.mode == 'unit' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$UNIT_DIR" ]; then
            echo "::error::Required unit test directory '$UNIT_DIR' does not exist."
            exit 1
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DETECT UNIT TEST TYPE / PACKAGE MANAGER
      # ============================================================

      - name: Detect unit-test package manager
        id: unit-package-manager
        if: |
          inputs.unit_command == '' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          ) &&
          steps.check-unit-tests.outputs.present == 'true'
        shell: bash
        env:
          ROOT_PM: ${{ steps.package-manager.outputs.pm }}
        run: |
          set -euo pipefail

          ROOT_DIR="$APP_DIR"
          UNIT_PATH="$UNIT_DIR"

          detect_node_pm() {
            local DIR="$1"

            if [ -f "$DIR/pnpm-lock.yaml" ]; then
              echo "pnpm"
            elif [ -f "$DIR/yarn.lock" ]; then
              echo "yarn"
            elif [ -f "$DIR/package-lock.json" ]; then
              echo "npm"
            else
              echo ""
            fi
          }

          if [ -f "$UNIT_PATH/package.json" ]; then

            PM="$(detect_node_pm "$UNIT_PATH")"

            if [ -z "$PM" ]; then
              echo "::error::Node unit-test project found at '$UNIT_PATH', but no lockfile was found."
              exit 1
            fi

            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "pm=$PM" >> "$GITHUB_OUTPUT"
            echo "location=nested" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          if [ -f "$UNIT_PATH/pytest.ini" ] ||
             [ -f "$UNIT_PATH/pyproject.toml" ] ||
             [ -f "$UNIT_PATH/requirements.txt" ]; then

            echo "type=python" >> "$GITHUB_OUTPUT"
            echo "pm=python" >> "$GITHUB_OUTPUT"
            echo "location=nested" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          if [ -f "$ROOT_DIR/package.json" ]; then

            PM="${ROOT_PM:-}"

            if [ -z "$PM" ]; then
              PM="$(detect_node_pm "$ROOT_DIR")"
            fi

            if [ -z "$PM" ]; then
              echo "::error::App package.json exists but no lockfile was found in $ROOT_DIR."
              exit 1
            fi

            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "pm=$PM" >> "$GITHUB_OUTPUT"
            echo "location=root" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          if [ -f "$ROOT_DIR/pytest.ini" ] ||
             [ -f "$ROOT_DIR/pyproject.toml" ] ||
             [ -f "$ROOT_DIR/requirements.txt" ]; then

            echo "type=python" >> "$GITHUB_OUTPUT"
            echo "pm=python" >> "$GITHUB_OUTPUT"
            echo "location=root" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "::error::Unable to detect unit-test runner."
          exit 1

      # ============================================================
      # DETECT UNIT PNPM VERSION
      # ============================================================

      - name: Detect unit-test pnpm version
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'pnpm' &&
          steps.unit-package-manager.outputs.location == 'nested'
        id: unit-pnpm-version
        shell: bash
        run: |
          set -euo pipefail

          cd "$UNIT_DIR"

          VERSION="$(
            node -pe '
              const pkg = require("./package.json");
              const value = pkg.packageManager || "";
              value.startsWith("pnpm@") ? value.substring(5) : "";
            '
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::Unit-test package.json must declare its pnpm version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SETUP UNIT PNPM
      # ============================================================

      - name: Setup unit-test pnpm
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'pnpm' &&
          steps.unit-package-manager.outputs.location == 'nested'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.unit-pnpm-version.outputs.version }}

      # ============================================================
      # ENABLE UNIT YARN
      # ============================================================

      - name: Enable unit-test Yarn
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.pm == 'yarn' &&
          steps.unit-package-manager.outputs.location == 'nested'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable

      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        if: steps.unit-package-manager.outputs.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # ============================================================
      # INSTALL ROOT NODE DEPENDENCIES
      # ============================================================

      - name: Install root Node dependencies
        if: |
          steps.package-manager.outputs.pm != 'none' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ inputs.working_directory }}"

          case "${{ steps.package-manager.outputs.pm }}" in

            pnpm)
              pnpm install --frozen-lockfile
              ;;

            yarn)
              yarn install --immutable
              ;;

            npm)
              npm ci
              ;;

            *)
              echo "::error::Unsupported package manager."
              exit 1
              ;;

          esac

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python unit-test dependencies
        if: steps.unit-package-manager.outputs.type == 'python'
        shell: bash
        env:
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_DIR"
          else
            cd "$APP_DIR"
          fi

          if [ -f requirements.txt ]; then

            python -m pip install -r requirements.txt

          elif [ -f pyproject.toml ]; then

            python -m pip install -e .

          elif [ -f pytest.ini ]; then

            python -m pip install pytest

          else

            echo "::error::No supported Python dependency configuration found."
            exit 1

          fi

      # ============================================================
      # INSTALL NESTED NODE UNIT DEPENDENCIES
      # ============================================================

      - name: Install Node unit-test dependencies
        if: |
          steps.unit-package-manager.outputs.type == 'node' &&
          steps.unit-package-manager.outputs.location == 'nested'
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail

          cd "$UNIT_DIR"

          case "${{ steps.unit-package-manager.outputs.pm }}" in

            pnpm)
              pnpm install --frozen-lockfile
              ;;

            yarn)
              yarn install --immutable
              ;;

            npm)
              npm ci
              ;;

            *)
              echo "::error::Unsupported unit-test package manager."
              exit 1
              ;;

          esac

      # ============================================================
      # SETUP UV
      #
      # Used when the caller passes unit_command for a uv project.
      # Node package managers stay on their own install step.
      # ============================================================

      - name: Detect uv project
        id: uv-project
        if: |
          inputs.unit_command != '' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$APP_DIR/uv.lock" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.uv-project.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python_version }}
          enable-cache: true

      - name: Sync uv dependencies
        if: steps.uv-project.outputs.present == 'true'
        shell: bash
        env:
          GIT_CONFIG_COUNT: ${{ secrets.ORG_ADMIN_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ORG_ADMIN_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          # dev group (cpod-backend, cpod-arai), the test extra (C3 backend),
          # or the dev extra.
          if ! uv sync --frozen --dev; then
            if ! uv sync --frozen --extra test; then
              uv sync --frozen --extra dev
            fi
          fi

      # ============================================================
      # RUN CUSTOM UNIT TESTS
      # ============================================================

      - name: Run custom unit command
        id: custom-unit-tests
        if: |
          inputs.unit_command != '' &&
          (
            steps.mode.outputs.mode == 'unit' ||
            steps.mode.outputs.mode == 'both'
          )
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.unit_command }}

      # ============================================================
      # RUN NODE UNIT TESTS
      # ============================================================

      - name: Run Node unit tests
        id: node-unit-tests
        if: |
          always() &&
          inputs.unit_command == '' &&
          steps.unit-package-manager.outputs.type == 'node'
        shell: bash
        env:
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          if [ "$UNIT_LOCATION" = "nested" ]; then
            cd "$UNIT_DIR"
          else
            cd "$APP_DIR"
          fi

          case "${{ steps.unit-package-manager.outputs.pm }}" in

            pnpm)
              pnpm test
              ;;

            yarn)
              yarn test
              ;;

            npm)
              npm test
              ;;

            *)
              echo "::error::Unsupported unit-test package manager."
              exit 1
              ;;

          esac

      # ============================================================
      # RUN PYTHON UNIT TESTS
      # ============================================================

      - name: Run Python unit tests
        id: python-unit-tests
        if: |
          always() &&
          inputs.unit_command == '' &&
          steps.unit-package-manager.outputs.type == 'python'
        shell: bash
        env:
          UNIT_LOCATION: ${{ steps.unit-package-manager.outputs.location }}
        run: |
          set -euo pipefail

          if [ "$UNIT_LOCATION" = "nested" ]; then

            cd "$UNIT_DIR"
            python -m pytest .

          else

            cd "$APP_DIR"

            # IMPORTANT:
            # Do not use "$UNIT_DIR" here because UNIT_DIR already
            # contains APP_DIR.
            #
            # Example:
            #   APP_DIR=backend
            #   unit_test_path=tests
            #
            # "$UNIT_DIR" would become:
            #   backend/tests
            #
            # After "cd backend", that would incorrectly resolve to:
            #   backend/backend/tests
            #
            # Use the caller-provided unit_test_path instead.
            python -m pytest "${{ inputs.unit_test_path }}"

          fi

      # ============================================================
      # VERIFY PLAYWRIGHT CONFIGURATION
      # ============================================================

      - name: Verify Playwright configuration
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${{ inputs.working_directory }}/${{ inputs.playwright_config }}"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Playwright configuration '$CONFIG' does not exist."
            exit 1
          fi

          EXTRA="${{ inputs.secondary_playwright_config }}"

          if [ -n "$EXTRA" ] &&
             [ ! -f "${{ inputs.working_directory }}/$EXTRA" ]; then

            echo "::error::Playwright configuration '${{ inputs.working_directory }}/$EXTRA' does not exist."
            exit 1

          fi

      # ============================================================
      # VERIFY E2E TEST DIRECTORY
      # ============================================================

      - name: Verify E2E test directory
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          E2E_PATH="${{ inputs.working_directory }}/${{ inputs.e2e_test_path }}"

          if [ ! -d "$E2E_PATH" ]; then
            echo "::error::Playwright test directory '$E2E_PATH' does not exist."
            exit 1
          fi

      # ============================================================
      # VERIFY DOCKER
      # ============================================================

      - name: Verify Docker
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          command -v docker >/dev/null 2>&1 || {
            echo "::error::Docker is not available."
            exit 1
          }

          docker --version
          docker compose version

      # ============================================================
      # START MONGODB
      # ============================================================

      - name: Start MongoDB
        if: |
          steps.detect-database.outputs.database == 'mongodb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          MONGO_NAME="ci-mongodb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker rm -f "$MONGO_NAME" >/dev/null 2>&1 || true

          docker run \
            -d \
            --name "$MONGO_NAME" \
            -p "127.0.0.1::27017" \
            mongo:8

          echo "CI_MONGO_NAME=$MONGO_NAME" >> "$GITHUB_ENV"

          MONGO_PORT="$(
            docker port "$MONGO_NAME" 27017/tcp |
            awk -F: 'NR==1 { print $NF }'
          )"

          if [ -z "$MONGO_PORT" ]; then
            echo "::error::MongoDB did not publish a host port."
            exit 1
          fi

          for i in $(seq 1 30); do

            if docker exec "$MONGO_NAME" \
              mongosh --quiet \
              --eval "db.adminCommand({ ping: 1 })" \
              >/dev/null 2>&1; then

              echo "MongoDB is ready on port $MONGO_PORT."

              echo "MONGODB_URI=mongodb://127.0.0.1:${MONGO_PORT}/?directConnection=true" \
                >> "$GITHUB_ENV"

              exit 0
            fi

            sleep 1

          done

          echo "::error::MongoDB did not become ready."

          docker logs "$MONGO_NAME" || true

          exit 1

      # ============================================================
      # START RELATABD
      # ============================================================

      - name: Start RelataDB
        if: |
          steps.detect-database.outputs.database == 'relatadb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Starting RelataDB"
          echo "========================================"

          echo "Removing leftover containers for this Compose project prefix"

          mapfile -t old_containers < <(
            docker ps -aq \
              --filter "name=threatmap-e2e-" || true
          )

          if [ "${#old_containers[@]}" -gt 0 ]; then
            docker rm -f "${old_containers[@]}" || true
          fi

          OVERRIDE="${RUNNER_TEMP}/relatadb-ci.yml"

          printf '%s\n' \
            'services:' \
            '  relatadb:' \
            '    environment:' \
            '      RELATA_ADMIN_TOKEN: threatmap-admin' \
            '      RELATA_KMS_LOCAL_DEV: "true"' \
            '      RELATA_DATA_DIR: /data/relata' \
            > "$OVERRIDE"

          if [ "$APP_DIR" = "." ]; then
            COMPOSE_BASE="${GITHUB_WORKSPACE}/docker-compose.yml"
          else
            COMPOSE_BASE="${GITHUB_WORKSPACE}/${APP_DIR}/docker-compose.yml"
          fi

          echo "COMPOSE_FILE=${COMPOSE_BASE}:${OVERRIDE}" >> "$GITHUB_ENV"

          export COMPOSE_FILE="${COMPOSE_BASE}:${OVERRIDE}"

          mapfile -t old_networks < <(
            docker network ls \
              --filter "name=threatmap-e2e-" \
              --format '{{.Name}}' || true
          )

          if [ "${#old_networks[@]}" -gt 0 ]; then
            docker network rm "${old_networks[@]}" || true
          fi

          docker compose down -v --remove-orphans || true

          docker compose up -d --force-recreate relatadb

          docker compose ps

          CONTAINER_ID="$(docker compose ps -q relatadb)"

          if [ -z "$CONTAINER_ID" ]; then
            echo "::error::RelataDB container was not created."
            exit 1
          fi

          echo "RelataDB authentication configuration:"

          docker inspect "$CONTAINER_ID" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' |
            grep -E '^RELATA_(BEARER_TOKEN|ADMIN_TOKEN)=' |
            sed 's/=.*$/=<redacted>/'

      # ============================================================
      # WAIT FOR RELATABD
      # ============================================================

      - name: Wait for RelataDB
        if: |
          steps.detect-database.outputs.database == 'relatadb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..60}; do

            if curl -fsS "$RELATADB_URL/health" >/dev/null 2>&1; then

              echo "RelataDB is healthy."

              curl -fsS "$RELATADB_URL/health"

              echo

              exit 0

            fi

            echo "RelataDB not ready yet ($i/60)..."

            if [ "$i" -eq 10 ] ||
               [ "$i" -eq 20 ] ||
               [ "$i" -eq 40 ]; then

              docker compose ps || true

              docker compose logs \
                --no-color \
                --tail=50 \
                relatadb || true

            fi

            sleep 2

          done

          echo "::error::RelataDB did not become healthy within 120 seconds."

          docker compose ps || true

          docker compose logs \
            --no-color \
            --tail=200 \
            relatadb || true

          exit 1

      # ============================================================
      # MINT RELATABD TENANT TOKEN
      # ============================================================

      - name: Mint RelataDB tenant token
        if: |
          steps.detect-database.outputs.database == 'relatadb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Minting RelataDB tenant token"
          echo "========================================"

          RESPONSE_FILE="$(mktemp)"

          trap 'rm -f "$RESPONSE_FILE"' EXIT

          CONTAINER_ID="$(docker compose ps -q relatadb)"

          if [ -z "$CONTAINER_ID" ]; then
            echo "::error::RelataDB container was not created."
            exit 1
          fi

          ADMIN_TOKEN="$(
            docker inspect "$CONTAINER_ID" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' |
              sed -n 's/^RELATA_ADMIN_TOKEN=//p'
          )"

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::RelataDB container has no RELATA_ADMIN_TOKEN."
            exit 1
          fi

          echo "::add-mask::$ADMIN_TOKEN"

          REQUEST_BODY='{"description":"threatmap playwright"}'

          mint_at() {

            local url="$1"
            local output curl_status http body

            set +e

            if docker exec "$CONTAINER_ID" \
              curl --version >/dev/null 2>&1; then

              output="$(
                docker exec "$CONTAINER_ID" \
                  curl \
                    -sS \
                    --max-time 20 \
                    -X POST "$url" \
                    -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data "$REQUEST_BODY" \
                    -w $'\n%{http_code}'
              )"

            else

              output="$(
                docker run \
                  --rm \
                  --network "container:${CONTAINER_ID}" \
                  curlimages/curl:8.11.1 \
                    -sS \
                    --max-time 20 \
                    -X POST "$url" \
                    -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data "$REQUEST_BODY" \
                    -w $'\n%{http_code}'
              )"

            fi

            curl_status=$?

            set -e

            if [ "$curl_status" -ne 0 ]; then

              echo "Mint unreachable at $url (curl exit $curl_status)." >&2

              printf '%s\n' "$output" > "$RESPONSE_FILE"

              echo "000"

              return 0

            fi

            http="${output##*$'\n'}"
            body="${output%$'\n'*}"

            printf '%s\n' "$body" > "$RESPONSE_FILE"

            echo "$http"
          }

          TOKEN=""

          for endpoint in \
            "http://127.0.0.1:8080/admin/tokens" \
            "http://127.0.0.1:9091/admin/tokens"
          do

            echo "Trying $endpoint"

            HTTP_STATUS="$(mint_at "$endpoint")"

            echo "HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ] ||
               [ "$HTTP_STATUS" = "201" ]; then

              TOKEN="$(
                node -e '
                  const fs = require("fs");

                  try {
                    const body =
                      JSON.parse(
                        fs.readFileSync(process.argv[1], "utf8")
                      );

                    process.stdout.write(
                      body.secret ||
                      body.token ||
                      ""
                    );

                  } catch {
                    process.exit(0);
                  }
                ' "$RESPONSE_FILE"
              )"

              if [ -n "$TOKEN" ]; then
                echo "RelataDB registry token minted."
                break
              fi

              echo "Mint response did not contain .secret or .token."

              TOKEN=""

            else

              echo "Mint response:"
              cat "$RESPONSE_FILE" || true
              echo

            fi

          done

          if [ -z "$TOKEN" ]; then

            echo "::error::RelataDB token minting failed."
            echo "::error::The bootstrap bearer is refused on the published port."

            exit 1

          fi

          echo "::add-mask::$TOKEN"

          echo "RELATADB_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "RelataDB tenant token configured."

      # ============================================================
      # VERIFY RELATABD AUTHENTICATION
      # ============================================================

      - name: Verify RelataDB authentication
        if: |
          steps.detect-database.outputs.database == 'relatadb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying RelataDB tenant authentication"
          echo "========================================"

          if [ -z "${RELATADB_TOKEN:-}" ]; then
            echo "::error::RELATADB_TOKEN was not created."
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"

          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_STATUS="$(
            curl \
              -sS \
              -o "$RESPONSE_FILE" \
              -w "%{http_code}" \
              -X POST \
              "$RELATADB_URL/query" \
              -H "Authorization: Bearer $RELATADB_TOKEN" \
              -H "X-Organization-Id: $RELATADB_ORG_ID" \
              -H "Content-Type: application/json" \
              --data '{"sql":"SELECT 1"}'
          )"

          echo "RelataDB query HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then

            echo "::error::RelataDB tenant authentication failed."
            echo "::error::HTTP status: $HTTP_STATUS"
            echo "::error::Response:"

            cat "$RESPONSE_FILE"

            docker compose ps || true

            docker compose logs \
              --no-color \
              --tail=200 \
              relatadb || true

            exit 1

          fi

          echo "RelataDB tenant authentication succeeded."

          cat "$RESPONSE_FILE"

          echo

      # ============================================================
      # INSTALL PLAYWRIGHT OS DEPENDENCIES
      # ============================================================

      - name: Install Playwright OS dependencies
        if: |
          inputs.install_playwright_deps == true &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          . /etc/os-release

          case "$VERSION_ID" in

            24.04)

              packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
                fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont \
                fonts-wqy-zenhei libasound2t64 libatk-bridge2.0-0t64 \
                libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 \
                libdbus-1-3 libdrm2 libfontconfig1 libfreetype6 libgbm1 \
                libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 \
                libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 xfonts-cyrillic \
                xfonts-scalable xvfb"

              ;;

            22.04)

              packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
                fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont \
                fonts-wqy-zenhei libasound2 libatk-bridge2.0-0 \
                libatk1.0-0 libatspi2.0-0 libcairo2 libcups2 libdbus-1-3 \
                libdrm2 libfontconfig1 libfreetype6 libgbm1 libglib2.0-0 \
                libnspr4 libnss3 libpango-1.0-0 libwayland-client0 \
                libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 xfonts-cyrillic \
                xfonts-scalable xvfb"

              ;;

            *)

              echo "::error::Unsupported runner OS: $PRETTY_NAME"
              exit 1

              ;;

          esac

          sudo apt-get \
            -o DPkg::Lock::Timeout=300 \
            update \
            -qq

          sudo apt-get \
            -o DPkg::Lock::Timeout=300 \
            install \
            -y \
            --no-install-recommends \
            $packages

      # ============================================================
      # INSTALL PLAYWRIGHT BROWSER
      # ============================================================

      - name: Install Playwright browser
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          case "${{ steps.package-manager.outputs.pm }}" in

            pnpm)
              pnpm exec playwright install "${{ inputs.playwright_browser }}"
              ;;

            yarn)
              yarn playwright install "${{ inputs.playwright_browser }}"
              ;;

            npm)
              npx --no-install playwright install "${{ inputs.playwright_browser }}"
              ;;

            *)
              echo "::error::Playwright requires a Node package manager in $APP_DIR."
              exit 1
              ;;

          esac

      # ============================================================
      # RUN PLAYWRIGHT
      # ============================================================

      - name: Run Playwright E2E tests
        id: playwright-tests
        if: |
          steps.mode.outputs.mode == 'playwright' ||
          steps.mode.outputs.mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Running Playwright E2E tests"
          echo "========================================"

          cd "$APP_DIR"

          run_playwright() {

            case "${{ steps.package-manager.outputs.pm }}" in

              pnpm)
                pnpm exec playwright "$@"
                ;;

              yarn)
                yarn playwright "$@"
                ;;

              npm)
                npx --no-install playwright "$@"
                ;;

              *)
                echo "::error::Playwright requires a Node package manager in $APP_DIR."
                exit 1
                ;;

            esac

          }

          case "${{ steps.detect-database.outputs.database }}" in

            none|mongodb)

              export RELATADB_REQUIRED=0

              run_playwright \
                test \
                -c "${{ inputs.playwright_config }}" \
                "${{ inputs.e2e_test_path }}"

              if [ -n "${{ inputs.secondary_playwright_config }}" ]; then

                run_playwright \
                  test \
                  -c "${{ inputs.secondary_playwright_config }}"

              fi

              exit 0

              ;;

          esac

          # ========================================================
          # THREATMAP PRODUCTION E2E
          # ========================================================

          export RELATADB_REQUIRED=1
          export RELATADB_OFFLINE=0
          export E2E_PROVISION_LOCAL_ADMIN=1
          export PLAYWRIGHT_SERVER_MODE=production
          export PLAYWRIGHT_BASE_URL=http://localhost:3000
          export AUTH_BASE_URL=http://localhost:3000
          export E2E_EXPOSE_VERIFY_URL=1
          export WEBAUTHN_RP_ID=localhost
          export WEBAUTHN_ORIGIN=http://localhost:3000
          export MONITOR_SCHEDULER_ENABLED=false

          if [ -z "${RELATADB_TOKEN:-}" ]; then
            echo "::error::RELATADB_TOKEN was not minted."
            exit 1
          fi

          if ! command -v openssl >/dev/null 2>&1; then
            echo "::error::openssl is required to create local E2E credentials."
            exit 1
          fi

          export THREATMAP_DEV_API_KEY="tm_live_$(openssl rand -hex 24)"
          export THREATMAP_VAULT_KEY="$(openssl rand -hex 32)"

          echo "::add-mask::$THREATMAP_DEV_API_KEY"
          echo "::add-mask::$THREATMAP_VAULT_KEY"

          JWT_KEY_DIR="$(mktemp -d)"

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$JWT_KEY_DIR/private.pem" \
            >/dev/null 2>&1

          openssl pkey \
            -in "$JWT_KEY_DIR/private.pem" \
            -pubout \
            -out "$JWT_KEY_DIR/public.pem" \
            >/dev/null 2>&1

          export AUTH_JWT_PRIVATE_KEY="$(cat "$JWT_KEY_DIR/private.pem")"
          export AUTH_JWT_PUBLIC_KEY="$(cat "$JWT_KEY_DIR/public.pem")"

          echo "RelataDB URL: $RELATADB_URL"
          echo "RelataDB organization: $RELATADB_ORG_ID"
          echo "RelataDB token: configured"
          echo "RelataDB required: $RELATADB_REQUIRED"
          echo "E2E provisioning: $E2E_PROVISION_LOCAL_ADMIN"
          echo "Playwright server: production"

          # ========================================================
          # START REDIS
          # ========================================================

          REDIS_NAME="threatmap-e2e-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker rm -f "$REDIS_NAME" >/dev/null 2>&1 || true

          docker run \
            -d \
            --name "$REDIS_NAME" \
            -p "127.0.0.1::6379" \
            redis:7-alpine

          echo "THREATMAP_CI_REDIS_NAME=$REDIS_NAME" >> "$GITHUB_ENV"

          REDIS_PORT="$(
            docker port "$REDIS_NAME" 6379/tcp |
            awk -F: 'NR==1 { print $NF }'
          )"

          if [ -z "$REDIS_PORT" ]; then
            echo "::error::Redis did not publish a host port."
            exit 1
          fi

          export REDIS_URL="redis://127.0.0.1:${REDIS_PORT}"

          for i in $(seq 1 30); do

            if docker exec "$REDIS_NAME" \
              redis-cli ping 2>/dev/null |
              grep -q PONG; then

              echo "Redis is ready on port $REDIS_PORT."

              break

            fi

            if [ "$i" -eq 30 ]; then

              echo "::error::Redis did not become ready."

              docker logs "$REDIS_NAME" || true

              exit 1

            fi

            sleep 1

          done

          curl -fsS "$RELATADB_URL/health"

          echo

          # ========================================================
          # BUILD PRODUCTION SERVER
          # ========================================================

          echo "Building production server for Playwright"

          cd "$APP_DIR"

          case "${{ steps.package-manager.outputs.pm }}" in

            pnpm)
              pnpm build
              ;;

            yarn)
              yarn build
              ;;

            npm)
              npm run build
              ;;

            *)
              echo "::error::Playwright requires a Node package manager in $APP_DIR."
              exit 1
              ;;

          esac

          # ========================================================
          # RUN PLAYWRIGHT
          # ========================================================

          run_playwright \
            test \
            -c "${{ inputs.playwright_config }}" \
            "${{ inputs.e2e_test_path }}"

      # ============================================================
      # UPLOAD PLAYWRIGHT REPORT
      # ============================================================

      - name: Upload Playwright report
        if: |
          always() &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            ${{ inputs.working_directory }}/playwright-report/
            ${{ inputs.working_directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # SHOW RELATABD LOGS ON FAILURE
      # ============================================================

      - name: Show RelataDB logs on failure
        if: |
          failure() &&
          steps.detect-database.outputs.database == 'relatadb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RelataDB container status"
          echo "========================================"

          docker compose ps || true

          echo "========================================"
          echo "RelataDB logs"
          echo "========================================"

          docker compose logs \
            --no-color \
            --tail=300 \
            relatadb || true

      # ============================================================
      # CLEAN UP RELATABD
      # ============================================================

      - name: Cleanup E2E infrastructure
        if: |
          always() &&
          steps.detect-database.outputs.database == 'relatadb' &&
          (
            steps.mode.outputs.mode == 'playwright' ||
            steps.mode.outputs.mode == 'both'
          )
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Stopping RelataDB"
          echo "========================================"

          docker compose down -v --remove-orphans || true

          if [ -n "${THREATMAP_CI_REDIS_NAME:-}" ]; then
            docker rm -f "$THREATMAP_CI_REDIS_NAME" || true
          fi

          echo "RelataDB cleanup completed."

      # ============================================================
      # CLEAN UP MONGODB
      # ============================================================

      - name: Stop MongoDB
        if: |
          always() &&
          steps.detect-database.outputs.database == 'mongodb'
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CI_MONGO_NAME:-}" ]; then
            docker rm -f "$CI_MONGO_NAME" || true
          fi

      # ============================================================
      # FINAL QUALITY GATE
      # ============================================================

      - name: Quality Gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ steps.mode.outputs.mode }}"

          PLAYWRIGHT_RESULT="${{ steps.playwright-tests.outcome }}"
          NODE_UNIT_RESULT="${{ steps.node-unit-tests.outcome }}"
          PYTHON_UNIT_RESULT="${{ steps.python-unit-tests.outcome }}"
          CUSTOM_UNIT_RESULT="${{ steps.custom-unit-tests.outcome }}"
          UNIT_TEST_TYPE="${{ steps.unit-package-manager.outputs.type }}"

          PLAYWRIGHT_RESULT="${PLAYWRIGHT_RESULT:-not-run}"
          NODE_UNIT_RESULT="${NODE_UNIT_RESULT:-not-run}"
          PYTHON_UNIT_RESULT="${PYTHON_UNIT_RESULT:-not-run}"
          CUSTOM_UNIT_RESULT="${CUSTOM_UNIT_RESULT:-not-run}"
          UNIT_TEST_TYPE="${UNIT_TEST_TYPE:-not-detected}"

          if [ -n "${{ inputs.unit_command }}" ]; then
            UNIT_TEST_TYPE="custom"
          fi

          echo "========================================"
          echo "Quality Gate Summary"
          echo "========================================"
          echo "Mode:               $MODE"
          echo "Playwright result:  $PLAYWRIGHT_RESULT"
          echo "Node unit result:   $NODE_UNIT_RESULT"
          echo "Python unit result: $PYTHON_UNIT_RESULT"
          echo "Unit test type:     $UNIT_TEST_TYPE"
          echo "========================================"

          case "$MODE" in

            playwright)

              if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
                echo "::error::Playwright quality gate failed."
                exit 1
              fi

              ;;

            unit)

              case "$UNIT_TEST_TYPE" in

                node)

                  if [ "$NODE_UNIT_RESULT" != "success" ]; then
                    echo "::error::Node unit test quality gate failed."
                    exit 1
                  fi

                  ;;

                python)

                  if [ "$PYTHON_UNIT_RESULT" != "success" ]; then
                    echo "::error::Python unit test quality gate failed."
                    exit 1
                  fi

                  ;;

                custom)

                  if [ "$CUSTOM_UNIT_RESULT" != "success" ]; then
                    echo "::error::Custom unit command quality gate failed."
                    exit 1
                  fi

                  ;;

                *)

                  echo "::error::No valid unit-test runner was detected."
                  exit 1

                  ;;

              esac

              ;;

            both)

              GATE_FAILED=false

              if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
                echo "::error::Playwright quality gate failed."
                GATE_FAILED=true
              fi

              case "$UNIT_TEST_TYPE" in

                node)

                  if [ "$NODE_UNIT_RESULT" != "success" ]; then
                    echo "::error::Node unit test quality gate failed."
                    GATE_FAILED=true
                  fi

                  ;;

                python)

                  if [ "$PYTHON_UNIT_RESULT" != "success" ]; then
                    echo "::error::Python unit test quality gate failed."
                    GATE_FAILED=true
                  fi

                  ;;

                custom)

                  if [ "$CUSTOM_UNIT_RESULT" != "success" ]; then
                    echo "::error::Custom unit command quality gate failed."
                    GATE_FAILED=true
                  fi

                  ;;

                *)

                  echo "::error::No valid unit-test runner was detected."
                  GATE_FAILED=true

                  ;;

              esac

              if [ "$GATE_FAILED" = "true" ]; then
                exit 1
              fi

              ;;

            *)

              echo "::error::Unknown quality gate mode: $MODE"
              exit 1

              ;;

          esac

          echo "========================================"
          echo "Quality Gate PASSED"
          echo "========================================"
