name: sprint retro (reusable)

on:
  workflow_call:

permissions:
  issues: write
  pull-requests: read

jobs:
  retro:
    name: Create sprint retro issue
    runs-on: ubuntu-latest
    steps:
      - name: Generate retro issue
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          WEEK=$(date +%Y-W%V)
          DATE=$(date +%Y-%m-%d)

          # Collect metrics from last 7 days
          MERGED_PRS=$(gh pr list --repo "$REPO" --state merged \
            --json number,title,mergedAt \
            --jq "[.[] | select(.mergedAt > \"$(date -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-7d +%Y-%m-%dT%H:%M:%SZ)\")] | length" \
            2>/dev/null || echo "N/A")

          OPEN_PRS=$(gh pr list --repo "$REPO" --state open --json number --jq 'length' 2>/dev/null || echo "N/A")
          OPEN_ISSUES=$(gh issue list --repo "$REPO" --state open --json number --jq 'length' 2>/dev/null || echo "N/A")
          BUGS=$(gh issue list --repo "$REPO" --state open --label "type:bug" --json number --jq 'length' 2>/dev/null || echo "N/A")

          # Check if retro issue already exists this week
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "Sprint Retro $WEEK" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Retro issue #$EXISTING already exists for $WEEK"
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "## Sprint Retrospective — $WEEK"
            echo ""
            echo "### Metrics"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| PRs merged (last 7 days) | $MERGED_PRS |"
            echo "| Open PRs | $OPEN_PRS |"
            echo "| Open issues | $OPEN_ISSUES |"
            echo "| Open bugs | $BUGS |"
            echo ""
            echo "---"
            echo ""
            echo "### What went well? ✅"
            echo "<!-- List 3 things that worked this sprint -->"
            echo "-"
            echo "-"
            echo "-"
            echo ""
            echo "### What didn't go well? ❌"
            echo "<!-- List blockers, pain points, delays -->"
            echo "-"
            echo "-"
            echo "-"
            echo ""
            echo "### Action items 🎯"
            echo "<!-- Specific, ownable improvements for next sprint -->"
            echo "- [ ] Owner:"
            echo "- [ ] Owner:"
            echo "- [ ] Owner:"
            echo ""
            echo "### Notes"
            echo "<!-- Any additional context, shoutouts, decisions made -->"
            echo ""
            echo "---"
            echo "> Auto-generated by sprint-retro workflow"
          } > "$BODY_FILE"

          gh issue create \
            --repo "$REPO" \
            --title "Sprint Retro — $WEEK ($DATE)" \
            --label "type:chore" \
            --body-file "$BODY_FILE" \
            2>/dev/null || echo "Retro issue creation skipped"
