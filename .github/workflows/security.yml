name: Security

on:
  push:
    branches: [develop, stage, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [develop, stage, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # Keep this job key stable: branch protection requires
  # "scan / Secret Scan (gitleaks)" on develop, stage, and release PRs.
  scan:
    uses: ZySec-AI/.github/.github/workflows/_reusable-security.yml@develop
    with:
      runs_on: '["self-hosted","linux","x64","zysec-ai-ci"]'
      auto_detect: true
      # Fast for develop/stage PRs, release hotfixes, and non-release pushes.
      # Release PRs without a hotfix label receive the full scan.
      fast-mode: >-
        ${{ (github.event_name != 'pull_request' && github.ref != 'refs/heads/release' && github.ref != 'refs/heads/stage') || (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'stage' || (github.base_ref == 'release' && contains(github.event.pull_request.labels.*.name, 'hotfix')))) }}
    secrets: inherit
