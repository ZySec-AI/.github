name: License Compatibility Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-license:
    uses: ZySec-AI/.github/.github/workflows/_reusable-check-license.yml@develop
    with:
      runs_on: '["self-hosted","linux","x64","zysec-ai-ci"]'
    secrets: inherit