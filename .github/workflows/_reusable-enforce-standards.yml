# =============================================================================
# REUSABLE WORKFLOW: Enforce Label & Milestone Standards
# PURPOSE:  Deletes labels not on the org manifest, and non-canonical milestones,
#           are created, and opens a guide issue so the creator knows what to
#           use instead. Keeps all repos aligned to the org-wide standard.
# TRIGGERS: Called by enforce-standards.yml in each product repo.
# DOCS:     https://github.com/ZySec-AI/.github/blob/develop/labels.yml
# =============================================================================
name: _reusable — Enforce Standards

on:
  workflow_call:

permissions:
  issues: write
  contents: read

jobs:
  enforce-label:
    if: github.event_name == 'label' && github.event.action == 'created'
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 10
    steps:
      - name: Block labels that are not on the org manifest
        uses: actions/github-script@v7
        with:
          script: |
            // Allowlist, read from the manifest at run time — not a hand-kept
            // denylist. The previous version listed known-bad names, which meant
            // every label nobody had thought of yet was permitted, and the list
            // drifted out of date the moment the taxonomy changed.
            const manifest = await github.rest.repos.getContent({
              owner: 'ZySec-AI', repo: '.github', path: 'labels.yml',
            });
            const yaml = Buffer.from(manifest.data.content, 'base64').toString('utf8');
            const allowed = new Set(
              [...yaml.matchAll(/^- name:\s*"([^"]+)"/gm)].map(m => m[1])
            );

            const name = context.payload.label.name;
            if (allowed.has(name)) {
              core.info(`'${name}' is on the manifest — allowed.`);
              return;
            }

            core.warning(`'${name}' is not on the manifest; deleting.`);
            await github.rest.issues.deleteLabel({
              owner: context.repo.owner, repo: context.repo.repo, name,
            });

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Non-standard label removed: "${name}"`,
              labels: ['agent:check'],
              body: [
                `The label \`${name}\` is not part of the ZySec-AI taxonomy and was deleted.`,
                '',
                '**Type, priority, severity, status, sprint, product and team are not labels.**',
                'They are native GitHub fields, which is why they are absent from the manifest:',
                '',
                '| You want | Use |',
                '|---|---|',
                '| Type | Issue Type — Bug / Feature / Task / Epic |',
                '| Priority | Issue Priority field (P0–P3) |',
                '| Severity | Issue Severity field |',
                '| Effort | Issue Effort field |',
                '| Status, Sprint, Product, Team | the Engineering Delivery project board |',
                '',
                'The taxonomy: https://github.com/ZySec-AI/.github/blob/develop/labels.yml',
                '',
                'If this label genuinely should exist, open a pull request against the manifest.',
                'A label that keeps being re-created usually means the manifest is missing',
                'something, not that the person is wrong.',
              ].join('\n'),
            });

  enforce-milestone:
    if: github.event_name == 'milestone' && github.event.action == 'created'
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    steps:
      - name: Block non-canonical milestone
        uses: actions/github-script@v7
        with:
          script: |
            const CANONICAL_MILESTONES = new Set([
              'v0.1 — Foundation',
              'v0.2 — Governance',
              'v0.3 — Runtime',
              'v0.4 — Intelligence',
              'v0.5 — Scale & Polish',
              'v1.0 — GA',
            ]);

            const title  = context.payload.milestone.title;
            const number = context.payload.milestone.number;

            if (CANONICAL_MILESTONES.has(title)) {
              core.info(`Milestone "${title}" is canonical — no action needed.`);
              return;
            }

            core.warning(`Non-standard milestone "${title}" detected — deleting.`);

            await github.rest.issues.deleteMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              milestone_number: number,
            });

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🗓️ Non-standard milestone blocked: "${title}"`,
              labels: ['agent:check'],
              body: [
                `## Milestone \`${title}\` was automatically removed`,
                '',
                'Milestones must match the org-wide release roadmap. The six canonical milestones are:',
                '',
                '| Milestone | What ships in it |',
                '|-----------|-----------------|',
                '| `v0.1 — Foundation` | Auth, multi-tenancy, and security baseline |',
                '| `v0.2 — Governance` | AI gateway, policy enforcement, audit trail, and compliance |',
                '| `v0.3 — Runtime` | App runtime, workflows, search, and core apps |',
                '| `v0.4 — Intelligence` | Advanced apps, EDM integrations, and analytics |',
                '| `v0.5 — Scale & Polish` | Performance, load testing, UX polish, and pre-GA cleanup |',
                '| `v1.0 — GA` | SOC 2, ISO 27001, pen-test sign-off, and enterprise certification |',
                '',
                'To track work outside these milestones, set the Issue Type (Epic) and the Priority field, or use the Engineering Delivery project board.',
                '',
                '> Milestone standard: https://github.com/ZySec-AI/.github',
              ].join('\n'),
            });
