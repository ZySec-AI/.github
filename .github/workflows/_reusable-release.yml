# =============================================================================
# WORKFLOW: Reusable — Release
# PURPOSE:  Ancestry guard (develop OR stage → release) → qa-approved gate
#           → changelog → GitHub release → Teams notification
# TRIGGERS: workflow_call
# INPUTS:   environment (string), notify (bool)
# SECRETS:  ORG_ADMIN_TOKEN (required), TEAMS_WEBHOOK (optional)
# CONTACT:  platform-eng@zysec.ai | #releases
# =============================================================================
name: release (reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      notify:
        type: boolean
        default: true
    secrets:
      ORG_ADMIN_TOKEN:
        required: false
      TEAMS_WEBHOOK:
        required: false

# One release pipeline per ref at a time, queued rather than cancelled — a
# publish/tag/notify sequence is not safe to interrupt partway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard — develop or stage must be ancestor of release
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify ancestry
        run: |
          set -euo pipefail
          # Supports both promote flows:
          #   develop → release
          #   develop → stage → release
          # Pass if develop OR stage is an ancestor of the release commit.
          git fetch --no-tags origin develop:refs/remotes/origin/develop 2>/dev/null || true
          git fetch --no-tags origin stage:refs/remotes/origin/stage 2>/dev/null || true
          REF="${{ github.sha }}"

          ok=false
          if git rev-parse --verify origin/develop >/dev/null 2>&1 \
            && git merge-base --is-ancestor origin/develop "$REF"; then
            echo "✓ develop is an ancestor of the release commit"
            ok=true
          fi
          if git rev-parse --verify origin/stage >/dev/null 2>&1 \
            && git merge-base --is-ancestor origin/stage "$REF"; then
            echo "✓ stage is an ancestor of the release commit"
            ok=true
          fi

          if [ "$ok" = true ]; then
            echo "✓ ancestry guard passed (develop and/or stage)"
          else
            echo "::error title=Ancestry Guard Failed::Release must include develop or stage history."
            echo "Supported flows: merge develop→release, or stage→release (after develop→stage)."
            echo "Fix: open a PR from develop or stage into release (prefer a merge commit, not squash)."
            exit 1
          fi

  qa-gate:
    name: QA Sign-off Gate
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 5
    needs: guard
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check qa-approved label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const names = (pr.labels || []).map(l => l.name);
            core.info('Labels: ' + (names.join(', ') || '(none)'));
            if (names.includes('qa-approved')) {
              core.info('qa-approved label present');
            } else {
              core.setFailed("This PR requires the 'qa-approved' label before merging to release. The QA team must validate on stage and apply the label.");
            }

  changelog:
    name: Generate Changelog
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 10
    needs: guard
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes_file: /tmp/release-notes.md
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            MAJOR=$(echo "$LAST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LAST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LAST" | sed 's/^v//' | cut -d. -f3 | tr -dc '0-9')

            # Semantic bump from conventional commits since last tag
            COMMITS=$(git log "${LAST}..HEAD" --format="%s%n%b" 2>/dev/null || echo "")
            if echo "$COMMITS" | grep -qE "(BREAKING CHANGE:|^[a-z]+!:)"; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          # FIX: was fetching ALL closed PRs with no date filter — returned same
          # stale list on every release. Now filtered to PRs since the last tag.
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            TAG_DATE=$(git log -1 --format=%aI "$LAST_TAG" 2>/dev/null || echo "1970-01-01T00:00:00Z")
            echo "Generating changelog since $LAST_TAG ($TAG_DATE)"
            gh api /repos/${{ github.repository }}/pulls \
              -f state=closed \
              -f base=release \
              --paginate \
              --jq --arg since "$TAG_DATE" \
              '.[] | select(.merged_at != null and .merged_at > $since) | [.number, .title] | @tsv' \
              > /tmp/pr_list.tsv 2>/dev/null || echo "" > /tmp/pr_list.tsv
          else
            echo "No previous tag — using last 50 merged PRs"
            gh api /repos/${{ github.repository }}/pulls \
              -f state=closed \
              -f base=release \
              --paginate \
              --jq '.[] | select(.merged_at != null) | [.number, .title] | @tsv' \
              | head -50 > /tmp/pr_list.tsv 2>/dev/null || echo "" > /tmp/pr_list.tsv
          fi

          # FIX: build release notes via file — avoids shell injection from PR titles.
          # PR titles containing $(...), backticks, or quotes would otherwise execute
          # as shell when interpolated via ${{ steps.notes.outputs.notes }}.
          {
            echo "## Changes"
            echo ""
            if [ -s /tmp/pr_list.tsv ]; then
              while IFS=$'	' read -r num title; do
                printf -- "- #%s %s\n" "$num" "$title"
              done < /tmp/pr_list.tsv
            else
              echo "- See commit history for changes"
            fi
          } > /tmp/release-notes.md

          echo "Release notes preview:"
          cat /tmp/release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-notes
          path: /tmp/release-notes.md
          retention-days: 7

  github-release:
    name: Create GitHub Release
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 10
    needs: [guard, changelog]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-notes
          path: /tmp/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          VERSION="${{ needs.changelog.outputs.version }}"
          git tag "$VERSION" 2>/dev/null || true
          git push origin "$VERSION" 2>/dev/null || true

          # FIX: use --notes-file instead of --notes "$NOTES"
          # --notes with a variable interpolated from workflow outputs is a
          # shell injection risk when PR titles contain special characters
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest \
            2>/dev/null || \
          gh release edit "$VERSION" \
            --title "Release $VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest

          echo "✓ GitHub Release $VERSION created"

  notify:
    name: Notify Teams
    runs-on: [self-hosted, linux, x64, zysec-ai-ci]
    timeout-minutes: 5
    needs: [github-release, changelog]
    # FIX: was `if: inputs.notify && always()` — fired even when guard failed,
    # sending a confusing "release failed" notification when no release was attempted.
    # Now only fires if the release job actually ran (success or failure).
    if: inputs.notify && needs.github-release.result != 'skipped'
    steps:
      - name: Post Teams notification
        env:
          HAS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK != '' }}
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        if: env.HAS_WEBHOOK == 'true'
        run: |
          VERSION="${{ needs.changelog.outputs.version }}"
          REPO="${{ github.repository }}"
          STATUS="${{ needs.github-release.result }}"
          COLOR=$([ "$STATUS" == "success" ] && echo "00CC00" || echo "CC0000")
          EMOJI=$([ "$STATUS" == "success" ] && echo "✅" || echo "❌")

          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"@context\": \"https://schema.org/extensions\",
              \"themeColor\": \"$COLOR\",
              \"summary\": \"Release $VERSION — $STATUS\",
              \"sections\": [{
                \"activityTitle\": \"$EMOJI Release $VERSION\",
                \"activitySubtitle\": \"$REPO\",
                \"facts\": [
                  {\"name\": \"Status\",      \"value\": \"$STATUS\"},
                  {\"name\": \"Version\",     \"value\": \"$VERSION\"},
                  {\"name\": \"Triggered by\",\"value\": \"${{ github.actor }}\"}
                ]
              }]
            }"
