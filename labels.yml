# ZySec AI — Canonical Label Definitions
#
# Apply with: github-label-sync or similar tool.
# Each repo inherits these labels. Repos may add their own `area:*` labels locally.
#
# Convention: colon-separated namespaces (type:bug, status:planned, priority:p1-high).
# One label per category per issue (one type, one status, one priority).
# Bugs get severity instead of (or in addition to) priority.

# ─── Type (pick one) ────────────────────────────────────────────
- name: "type:epic"
  color: "5319E7"
  description: "Cross-cutting initiative spanning multiple repos or milestones"
- name: "type:feature"
  color: "A2EEEF"
  description: "New functionality"
- name: "type:bug"
  color: "D73A4A"
  description: "Defect, regression, or incorrect behavior"
- name: "type:task"
  color: "1D76DB"
  description: "Chore, refactor, infra, docs, test, or maintenance work"
- name: "type:spec"
  color: "5319E7"
  description: "Design spec, architecture decision, manifest, or validation plan"
- name: "type:chore"
  color: "EDEDED"
  description: "Maintenance, tooling, dependency updates"
- name: "type:tech-debt"
  color: "FBCA04"
  description: "Refactor, cleanup, migration, or maintainability work"
- name: "type:docs"
  color: "0075CA"
  description: "Documentation only"
- name: "type:infra"
  color: "5319E7"
  description: "CI, deployment, Kubernetes, tooling"
- name: "type:test"
  color: "0052CC"
  description: "Tests only — no production code changes"

# ─── Status (pick one) ──────────────────────────────────────────
- name: "status:planned"
  color: "C2E0C6"
  description: "Not started yet"
- name: "status:ready"
  color: "0E8A16"
  description: "Specs complete, ready to implement"
- name: "status:in-progress"
  color: "FBCA04"
  description: "Active implementation"
- name: "status:blocked"
  color: "E11D21"
  description: "Waiting on dependency or decision"
- name: "status:done"
  color: "0E8A16"
  description: "Completed and validated"
- name: "status:superseded"
  color: "BFDADC"
  description: "Replaced by another issue"

# ─── Priority (pick one) ────────────────────────────────────────
- name: "priority:p0-critical"
  color: "B60205"
  description: "Blocker — must ship now"
- name: "priority:p1-high"
  color: "D93F0B"
  description: "Important — current sprint"
- name: "priority:p2-normal"
  color: "FBCA04"
  description: "Normal priority"
- name: "priority:p3-low"
  color: "0E8A16"
  description: "Nice to have"

# ─── Severity (for bugs and audit findings) ─────────────────────
- name: "severity:critical"
  color: "B60205"
  description: "Fix immediately — production impact"
- name: "severity:high"
  color: "D93F0B"
  description: "Fix soon — significant impact"
- name: "severity:medium"
  color: "FBCA04"
  description: "Fix when possible — moderate impact"
- name: "severity:low"
  color: "C2E0C6"
  description: "Fix eventually — minor impact"

# ─── Dimension (for review and audit findings) ──────────────────
- name: "dimension:security"
  color: "EE0701"
  description: "Security finding (OWASP, CVE, secrets)"
- name: "dimension:quality"
  color: "5319E7"
  description: "Code quality (dead code, complexity, conventions)"
- name: "dimension:deps"
  color: "0366D6"
  description: "Dependency health (outdated, vulnerable)"
- name: "dimension:perf"
  color: "F9D0C4"
  description: "Performance"
- name: "dimension:ui"
  color: "E99695"
  description: "UI / accessibility"

# ─── Automation (workflow labels) ────────────────────────────────
- name: "bot-reviewed"
  color: "6F42C1"
  description: "Triage bot has classified this issue"
- name: "bot-skip"
  color: "EDEDED"
  description: "Skip triage bot processing"
- name: "auto-fixable"
  color: "0E8A16"
  description: "Bot assessed as likely auto-fixable"
- name: "needs-info"
  color: "FBCA04"
  description: "Needs more context from requester"
- name: "good-first-issue"
  color: "7057FF"
  description: "Good for newcomers"

# ─── Simulation (from /simulate cycles) ─────────────────────────
- name: "sim"
  color: "E4E669"
  description: "Found by simulation"
- name: "carry"
  color: "FF6B35"
  description: "Bug surviving 2+ simulation cycles"
- name: "highlight"
  color: "0E8A16"
  description: "Positive product signal"
