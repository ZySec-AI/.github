# ZySec AI — the label taxonomy. This file is the definition; sync-labels.yml
# enforces it across every non-archived repository in the organisation.
#
# History worth knowing: this file previously held a 37-label scheme
# (type:*, status:*, priority:*) that nothing applied, alongside a second and
# different list in .github/labels/labels.json. Neither was enforced, so 141
# divergent labels grew across the org and both files became fiction. The
# labels.json duplicate has been deleted — one source of truth or none.
#
# A label earns a place here only if no native GitHub field holds the same
# information:
#   Type      -> native Issue Types (Bug / Feature / Task / Epic)
#   Priority  -> native issue Priority field (P0-P3)
#   Severity  -> native issue Severity field
#   Effort    -> native issue Effort field
#   Status    -> Projects v2 Status field
#   Sprint    -> Projects v2 Iteration field
#   Product   -> Projects v2 Product field
#   Team      -> Projects v2 Tech Lead field
#
# Changing this file changes every repository. Review accordingly.
#
- name: "found-in:production"
  color: "B60205"
  description: "A customer or production monitoring found this defect"
- name: "found-in:internal"
  color: "0E8A16"
  description: "Found by QA, simulation, review or CI before release"
- name: "security"
  color: "B60205"
  description: "Security work or a security-relevant defect"
# Kept flat rather than `qa:regression`: `qa:*` records what verification
# concluded, and a regression is a property of the defect. A customer can find one
# in production, where QA was never involved.
- name: "regression"
  color: "D93F0B"
  description: "Something that used to work and no longer does"
- name: "bugfix"
  color: "5319E7"
  description: "Pull request that fixes a defect (PRs only — issues use Issue Type: Bug)"

# --- QA verification outcome ------------------------------------------------
# The board's `QA Validation` status means "needs verifying". These record what
# verification concluded, which Status cannot hold because an item moves on.
- name: "qa:verified"
  color: "0E8A16"
  description: "QA confirmed the fix works"
- name: "qa:rejected"
  color: "B60205"
  description: "QA confirmed the fix does not work"
- name: "qa:uat"
  color: "FBCA04"
  description: "In user acceptance testing"
- name: "qa:uat-fail"
  color: "B60205"
  description: "Failed user acceptance testing"

# --- Simulation programme ---------------------------------------------------
- name: "sim:run"
  color: "1D76DB"
  description: "Raised by a simulated user journey"
- name: "sim:highlight"
  color: "1D76DB"
  description: "Simulation cycle summary"
- name: "sim:readiness"
  color: "1D76DB"
  description: "Release-readiness check"

# --- Topic: a closed list ---------------------------------------------------
# Engineers need to filter by subject. Without a supplied vocabulary they invent
# one, and the enforcement becomes something to route around rather than use.
- name: "area:auth"
  color: "C5DEF5"
  description: "Authentication and identity"
- name: "area:authz"
  color: "C5DEF5"
  description: "Authorisation, roles and permissions"
- name: "area:ui"
  color: "C5DEF5"
  description: "User interface, UX and accessibility"
- name: "area:performance"
  color: "C5DEF5"
  description: "Latency, throughput and optimisation"
- name: "area:reliability"
  color: "C5DEF5"
  description: "Availability, resilience and error handling"
- name: "area:observability"
  color: "C5DEF5"
  description: "Logging, metrics, tracing and diagnostics"
- name: "area:testing"
  color: "C5DEF5"
  description: "Test coverage and test infrastructure"
- name: "area:ci"
  color: "C5DEF5"
  description: "Build pipeline and CI"
- name: "area:ops"
  color: "C5DEF5"
  description: "Deployment, infrastructure and release operations"
- name: "area:governance"
  color: "C5DEF5"
  description: "Compliance, audit and policy"
- name: "area:multi-tenant"
  color: "C5DEF5"
  description: "Tenancy and data isolation"
- name: "area:dx"
  color: "C5DEF5"
  description: "Developer experience and tooling"

# --- Architectural layer -----------------------------------------------------
# Deliberately NOT part of area:*. `area:` is a functional axis (auth, ui,
# performance); this is an architectural one. An issue is legitimately both
# `area:auth` and `layer:backend`, and collapsing them into one namespace would
# make "area" mean two different things and filtering by it meaningless.
#
# The Cyberpod Tracker board carries the same idea in its `Component` field. These
# labels exist because 57 of 66 repositories are not on any board.
- name: "layer:frontend"
  color: "BFD4F2"
  description: "Client-side: UI, browser, mobile"
- name: "layer:backend"
  color: "BFD4F2"
  description: "Server-side: APIs, services, data"
- name: "layer:infra"
  color: "BFD4F2"
  description: "Infrastructure, deployment and platform plumbing"

# --- Automation: applied by machines, never by people -----------------------
- name: "agent:skip"
  color: "EDEDED"
